<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q&A 상세보기</title>

    <link rel="stylesheet" href="../../static/css/board/viewstyle.css">
</head>

<body>

<div class="container">

    <!-- 제목 -->
    <div class="title">
        API연동 방법 문의
    </div>

    <!-- 정보 -->
    <div class="info">
        작성자 : 박민수 |
        작성일 : 2026-06-10 |
        조회수 : 51
    </div>

    <!-- 내용 -->
    <div class="content">
        안녕하세요. <br>
        저희는 자사 쇼핑몰 시스템과 귀사 API를 연동하여 상품 조회 및 주문 생성 기능을 구현하고자 합니다.<br>
        현재 문서를 참고하여 개발을 진행 중이나, 아래 내용이 명확하지 않아 문의드립니다.
    </div>

    <!-- 댓글 -->
    <div class="comment-section">

        <h3>댓글</h3>

        <textarea id="commentInput"
                  class="comment-input"
                  placeholder="댓글을 입력하세요"></textarea>

        <button class="comment-btn" onclick="addComment()">
            댓글 등록
        </button>

        <div id="commentList" class="comment-list"></div>

    </div>

    <!-- 버튼 -->
    <div class="btn-area">

        <a href="/qna/list" class="btn-list">목록</a>

        <button class="btn-edit"
                onclick="location.href='qnaUpdate.html'">
            수정
        </button>

        <button class="btn-delete"
                onclick="deletePost()">
            삭제
        </button>

    </div>

</div>

<!-- JS 분리 -->
<script src="view01.js"></script>

</body>
</html>
