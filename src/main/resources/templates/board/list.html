<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" data-theme="light">
<head>
    <meta charset="UTF-8">
    <title>조은IT쇼핑몰 - Q&A 게시판</title>

    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.24/dist/full.min.css" rel="stylesheet" type="text/css"/>
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="/css/common/head.css">
</head>

<body class="bg-gray-50 text-gray-900 min-h-screen">

<div th:replace="~{common/head :: head}"></div>

<main class="max-w-5xl mx-auto px-4 py-10">

    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8 md:p-10">

        <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4 mb-8 pb-6 border-b border-gray-100">

            <div>
                <h1 class="text-3xl font-bold text-gray-800 tracking-tight">
                    Q&A 게시판
                </h1>

                <p class="text-sm text-gray-400 mt-1">
                    조은IT 쇼핑몰 이용 중 궁금하신 점을 남겨주세요.
                </p>
            </div>

            <form action="/board" method="get" class="join">

                <select name="type"
                        class="select select-bordered join-item font-medium text-sm focus:outline-none">

                    <option value="title">
                        제목
                    </option>

                    <option value="content">
                        내용
                    </option>

                </select>

                <input class="input input-bordered join-item focus:outline-none w-48 sm:w-64"
                       name="keyword"
                       placeholder="검색어를 입력하세요"/>

                <button type="submit"
                        class="btn btn-primary join-item bg-blue-600 border-blue-600 hover:bg-blue-700 text-white px-6">
                    검색
                </button>

            </form>

        </div>

        <div class="overflow-x-auto">

            <table class="table w-full text-center">

                <thead>

                <tr class="text-gray-500 text-sm border-b border-gray-100 bg-gray-50/50">

                    <th class="py-4 w-16 font-semibold">
                        번호
                    </th>

                    <th class="py-4 w-24 font-semibold">
                        구분
                    </th>

                    <th class="py-4 text-left font-semibold">
                        제목
                    </th>

                    <th class="py-4 w-32 font-semibold">
                        작성자
                    </th>

                    <th class="py-4 w-32 font-semibold">
                        작성일
                    </th>

                    <th class="py-4 w-20 font-semibold">
                        조회수
                    </th>

                </tr>

                </thead>

                <tbody class="text-gray-600 text-sm">

                <tr th:each="board : ${list}"
                    class="hover:bg-gray-50/80 transition-colors border-b border-gray-100">

                    <td class="py-4 font-medium"
                        th:text="${board.boardId}">
                        1
                    </td>

                    <td class="py-4">

                        <span class="badge badge-outline"
                              th:text="${board.boardType}">
                            QNA
                        </span>

                    </td>

                    <td class="py-4 text-left font-medium text-blue-600 hover:underline cursor-pointer">

                        <a th:href="@{/board/view(boardId=${board.boardId})}"
                           th:text="${board.title}">
                            상품 등록이 되지 않습니다.
                        </a>

                        <div th:if="${board.productName != null}"
                             class="text-xs text-gray-400 mt-1">

                            상품 :
                            <span th:text="${board.productName}">
                                상품명
                            </span>

                        </div>

                    </td>

                    <td class="py-4 text-gray-500"
                        th:text="${board.nickname != null ? board.nickname : '알 수 없음'}">
                        홍길동
                    </td>

                    <td class="py-4 text-gray-400"
                        th:text="${board.createdAt != null ? #temporals.format(board.createdAt, 'yyyy-MM-dd') : '-'}">
                        2026-06-16
                    </td>

                    <td class="py-4">

                        <span class="badge badge-ghost font-mono"
                              th:text="${board.hit}">
                            0
                        </span>

                    </td>

                </tr>

                <tr th:if="${list == null or #lists.isEmpty(list)}">

                    <td colspan="6"
                        class="py-12 text-gray-400">
                        등록된 문의 글이 없습니다.
                    </td>

                </tr>

                </tbody>

            </table>

        </div>

        <div class="flex flex-col sm:flex-row items-center justify-between gap-4 mt-8 pt-6 border-t border-gray-100">

            <div class="text-sm text-gray-400">
                문의사항이 있다면 글쓰기를 눌러 작성해 주세요.
            </div>

            <a th:href="@{/board/write}"
               class="btn btn-primary bg-blue-600 border-blue-600 hover:bg-blue-700 text-white px-6 shadow-md shadow-blue-100 rounded-xl w-full sm:w-auto">

                ✏️ 글쓰기

            </a>

        </div>

    </div>

</main>

</body>
</html>
