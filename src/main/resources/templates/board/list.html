<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시판</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/common/head.css}">
    <link rel="stylesheet" th:href="@{/css/board/liststyle.css}">
</head>
<body class="bg-gray-50">
<div th:replace="~{common/head :: head}"></div>

<div class="container mx-auto px-4 mt-10" style="max-width: 1200px;">

    <div class="board-title text-center mb-8">
        <h1 class="text-3xl font-bold text-gray-800">
            <span th:if="${boardType == 'ALL' or boardType == null}">📝 통합 게시판</span>
            <span th:if="${boardType == 'NOTICE'}">📢 공지사항</span>
            <span th:if="${boardType == 'FAQ'}">💡 자주 묻는 질문 (FAQ)</span>
            <span th:if="${boardType == 'REVIEW'}">💬 리뷰 / 자유 게시판</span>
            <span th:if="${boardType == 'QNA'}">❓ Q&A 게시판</span>
            <span th:if="${boardType == 'INQUIRY'}">🔒 1:1 비밀 문의</span>
        </h1>
    </div>

    <div class="flex justify-center gap-2 mb-6 flex-wrap">
        <a href="/board/list?type=ALL" th:classappend="${boardType == 'ALL' or boardType == null ? 'bg-blue-600 text-white' : 'bg-white text-gray-600 border border-gray-300'}" class="px-5 py-2 rounded-full font-bold shadow-sm hover:bg-blue-500 hover:text-white transition">전체보기</a>
        <a href="/board/list?type=NOTICE" th:classappend="${boardType == 'NOTICE' ? 'bg-blue-600 text-white' : 'bg-white text-gray-600 border border-gray-300'}" class="px-5 py-2 rounded-full font-bold shadow-sm hover:bg-blue-500 hover:text-white transition">공지사항</a>
        <a href="/board/list?type=FAQ" th:classappend="${boardType == 'FAQ' ? 'bg-blue-600 text-white' : 'bg-white text-gray-600 border border-gray-300'}" class="px-5 py-2 rounded-full font-bold shadow-sm hover:bg-blue-500 hover:text-white transition">FAQ</a>
        <a href="/board/list?type=REVIEW" th:classappend="${boardType == 'REVIEW' ? 'bg-blue-600 text-white' : 'bg-white text-gray-600 border border-gray-300'}" class="px-5 py-2 rounded-full font-bold shadow-sm hover:bg-blue-500 hover:text-white transition">리뷰/자유</a>
        <a href="/board/list?type=QNA" th:classappend="${boardType == 'QNA' ? 'bg-blue-600 text-white' : 'bg-white text-gray-600 border border-gray-300'}" class="px-5 py-2 rounded-full font-bold shadow-sm hover:bg-blue-500 hover:text-white transition">Q&A</a>
        <a th:if="${session.loggedMember != null}" href="/board/list?type=INQUIRY" th:classappend="${boardType == 'INQUIRY' ? 'bg-gray-800 text-white' : 'bg-white text-gray-600 border border-gray-300'}" class="px-5 py-2 rounded-full font-bold shadow-sm hover:bg-gray-700 hover:text-white transition">1:1 문의</a>
    </div>

    <form action="/board/list" method="get" class="search-area flex justify-center mb-6">
        <input type="hidden" name="type" th:value="${boardType != null ? boardType : 'ALL'}">
        <select name="searchType" class="border border-gray-300 px-3 h-10 rounded-l-md outline-none focus:border-blue-500 box-border">
            <option value="title" th:selected="${searchType == 'title'}">제목</option>
            <option value="content" th:selected="${searchType == 'content'}">내용</option>
            <option value="titleContent" th:selected="${searchType == 'titleContent'}">제목+내용</option>
            <option value="writer" th:selected="${searchType == 'writer'}">작성자</option>
        </select>
        <input type="text" name="keyword" th:value="${keyword}" maxlength="100" placeholder="검색어를 입력하세요 (최대 100자)" class="border-y border-r border-gray-300 px-4 w-80 h-10 outline-none focus:border-blue-500 box-border">
        <button type="submit" class="bg-blue-500 text-white px-6 h-10 rounded-r-md hover:bg-blue-600 font-bold box-border">검색</button>
    </form>

    <table class="board-table w-full text-center bg-white shadow-sm rounded-lg overflow-hidden align-middle">
        <thead class="bg-blue-600 text-white">
        <tr>
            <th class="py-3 px-4 w-16">번호</th>
            <th class="py-3 px-4 w-28">분류</th>
            <th class="py-3 px-4">제목</th>
            <th class="py-3 px-4 w-32">작성자</th>
            <th class="py-3 px-4 w-40">작성일</th>
            <th class="py-3 px-4 w-20">조회수</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="board : ${boardList}" class="border-b border-gray-100 transition hover:bg-gray-50">
            <td class="py-4 text-gray-500 align-middle" th:text="${board.boardId}">1</td>

            <td class="py-4 align-middle">
                <span th:if="${board.boardType == 'NOTICE'}" class="bg-red-100 text-red-600 px-2 py-1 rounded text-xs font-bold">공지</span>
                <span th:if="${board.boardType == 'FAQ'}" class="bg-blue-100 text-blue-600 px-2 py-1 rounded text-xs font-bold">FAQ</span>
                <span th:if="${board.boardType == 'REVIEW'}" class="bg-green-100 text-green-600 px-2 py-1 rounded text-xs font-bold">리뷰/자유</span>
                <span th:if="${board.boardType == 'QNA'}" class="bg-purple-100 text-purple-600 px-2 py-1 rounded text-xs font-bold">Q&A</span>
                <span th:if="${board.boardType == 'INQUIRY'}" class="bg-gray-800 text-white px-2 py-1 rounded text-xs font-bold">1:1문의</span>
            </td>

            <td class="px-4 py-4 align-middle text-left">
                <div class="flex items-center justify-start gap-2">

                    <th:block th:if="${board.boardType == 'INQUIRY' and (session.loggedMember == null or (session.loggedMember.role != 'ADMIN' and session.loggedMember.memberId != board.memberId))}">
                        <a href="#" onclick="alert('비밀글은 작성자와 관리자만 볼 수 있습니다.'); return false;" class="text-gray-400 font-medium">🔒 비밀글입니다.</a>
                    </th:block>

                    <th:block th:unless="${board.boardType == 'INQUIRY' and (session.loggedMember == null or (session.loggedMember.role != 'ADMIN' and session.loggedMember.memberId != board.memberId))}">
                        <a th:href="@{/board/view(id=${board.boardId})}" th:text="${board.title}" class="hover:text-blue-600 font-medium" th:classappend="${board.boardType == 'NOTICE'} ? 'font-bold text-red-600' : ''">제목</a>
                    </th:block>

                    <span th:if="${(board.boardType == 'QNA' or board.boardType == 'INQUIRY') and board.replyStatus == '답변대기'}" class="text-[10px] bg-gray-200 text-gray-600 px-2 py-0.5 rounded-full font-bold whitespace-nowrap">답변대기</span>
                    <span th:if="${(board.boardType == 'QNA' or board.boardType == 'INQUIRY') and board.replyStatus == '답변완료'}" class="text-[10px] bg-blue-100 text-blue-700 px-2 py-0.5 rounded-full font-bold whitespace-nowrap">답변완료</span>
                </div>
            </td>

            <td class="py-4 align-middle">
                <div class="flex flex-col items-center justify-center gap-1">
                    <span th:text="${board.writerNickname}" class="text-sm"></span>
                    <span class="badge" style="font-size: 9px; padding: 2px 6px 1px 6px;"
                          th:classappend="${board.writerRole == 'ADMIN' ? 'badge-admin' : (board.writerMembership != null ? 'badge-' + #strings.toLowerCase(board.writerMembership) : 'badge-bronze')}"
                          th:text="${board.writerRole == 'ADMIN' ? 'ADMIN' : (board.writerMembership != null ? board.writerMembership : 'BRONZE')}">
                    </span>
                </div>
            </td>

            <td class="py-4 text-sm text-gray-500 align-middle" th:text="${#temporals.format(board.createdAt, 'yyyy-MM-dd HH:mm:ss')}"></td>
            <td class="py-4 text-sm text-gray-500 align-middle" th:text="${board.hit}"></td>
        </tr>

        <tr th:if="${boardList == null or boardList.isEmpty()}">
            <td colspan="6" class="py-12 text-center text-gray-500 align-middle">등록된 게시글이 없습니다.</td>
        </tr>
        </tbody>
    </table>

    <div class="flex justify-between items-center mt-6">
        <div></div>
        <div class="flex gap-1" th:if="${totalPage > 0}">
            <a th:href="@{/board/list(type=${boardType}, searchType=${searchType}, keyword=${keyword}, page=1)}" class="px-3 py-1 border border-gray-300 rounded text-gray-600 hover:bg-gray-100 font-bold">&lt;&lt;</a>

            <th:block th:each="pageNum : ${#numbers.sequence(startPage, endPage)}">
                <a th:href="@{/board/list(type=${boardType}, searchType=${searchType}, keyword=${keyword}, page=${pageNum})}"
                   th:text="${pageNum}"
                   th:classappend="${pageNum == currentPage} ? 'bg-blue-600 text-white font-bold border-blue-600' : 'border-gray-300 text-gray-600 hover:bg-gray-100'"
                   class="px-3 py-1 border rounded transition">1</a>
            </th:block>

            <a th:href="@{/board/list(type=${boardType}, searchType=${searchType}, keyword=${keyword}, page=${totalPage})}" class="px-3 py-1 border border-gray-300 rounded text-gray-600 hover:bg-gray-100 font-bold">&gt;&gt;</a>
        </div>

        <button th:if="${session.loggedMember != null}"
                class="bg-blue-600 text-white px-6 py-2 rounded font-bold hover:bg-blue-700 shadow"
                onclick="location.href='/board/write'">글쓰기</button>
        <div th:unless="${session.loggedMember != null}"></div>
    </div>
</div>
</body>
</html>
