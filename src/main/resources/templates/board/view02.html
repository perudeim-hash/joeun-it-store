<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q&A 상세보기</title>

    <link rel="stylesheet" href="../../static/css/board/viewstyle.css">
</head>

<body>

<div class="container">

    <div class="title">
        주문 수집 오류 문의
    </div>

    <div class="info">
        작성자 : 김철수 |
        작성일 : 2026-06-12 |
        조회수 : 95
    </div>

    <div class="content">
        안녕하세요.<br>
        현재 쇼핑몰 관리자에서 주문 수집을 진행했는데 일부 주문이 정상적으로 수집되지 않고 있습니다.<br>
        특정 주문번호가 누락되거나 "수집 실패"로 표시되는 현상이 발생합니다. 확인 부탁드립니다.<br>
        감사합니다.
    </div>

    <!-- 댓글 -->
    <div class="comment-section">

        <h3>댓글</h3>

        <textarea id="commentInput"
                  class="comment-input"
                  placeholder="댓글을 입력하세요"></textarea>

        <button class="comment-btn" onclick="addComment()">
            댓글 등록
        </button>

        <div id="commentList" class="comment-list"></div>

    </div>

    <!-- 버튼 -->
    <div class="btn-area">

        <a href="/qna/list" class="btn-list">목록</a>

        <button class="btn-edit"
                onclick="location.href='qnaUpdate.html'">
            수정
        </button>

        <button class="btn-delete" onclick="deletePost()">
            삭제
        </button>

    </div>

</div>

<!-- JS 연결 -->
<script src="view01.js"></script>

</body>
</html>
