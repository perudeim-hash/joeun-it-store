<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      data-theme="light">

<head>
    <meta charset="UTF-8">
    <title>상품상세</title>

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="stylesheet" href="/css/common/head.css">
</head>

<body class="bg-base-200">

<div th:replace="~{common/head :: head}"></div>

<div class="max-w-[1200px] mx-auto mt-10 mb-20">

    <div class="card bg-base-100 shadow-xl">

        <div class="card-body p-8">

            <h1 class="text-4xl font-bold mb-6">
                상품상세
            </h1>

            <div class="divider"></div>

            <div class="flex gap-10">

                <!-- 상품 정보 -->
                <div class="flex-1">

                    <div class="space-y-4 text-lg">

                        <p>
                            <strong>상품명 :</strong>
                            <span th:text="${product.productName}">상품명</span>
                        </p>

                        <p>
                            <strong>브랜드 :</strong>
                            <span th:text="${product.brand}">브랜드</span>
                        </p>

                        <p>
                            <strong>모델명 :</strong>
                            <span th:text="${product.modelName != null ? product.modelName : '-'}">모델명</span>
                        </p>

                        <p>
                            <strong>가격 :</strong>
                            <span th:text="${#numbers.formatInteger(product.price, 3, 'COMMA')}">0</span>
                            원
                        </p>

                        <p>
                            <strong>재고 :</strong>
                            <span th:text="${product.stock}">0</span>
                            개
                        </p>

                        <p>
                            <strong>판매량 :</strong>
                            <span th:text="${product.salesCount != null ? product.salesCount : 0}">0</span>
                            개
                        </p>

                        <p>
                            <strong>상태 :</strong>
                            <span class="badge badge-success"
                                  th:if="${product.status == 'SALE'}"
                                  th:text="${product.status}">
                                SALE
                            </span>

                            <span class="badge badge-error"
                                  th:if="${product.status == 'SOLD_OUT'}"
                                  th:text="${product.status}">
                                SOLD_OUT
                            </span>

                            <span class="badge badge-neutral"
                                  th:if="${product.status == 'STOP'}"
                                  th:text="${product.status}">
                                STOP
                            </span>
                        </p>

                        <div class="divider"></div>

                        <p>
                            <strong>CPU :</strong>
                            <span th:text="${product.cpu != null ? product.cpu : '-'}">CPU</span>
                        </p>

                        <p>
                            <strong>RAM :</strong>
                            <span th:text="${product.ram != null ? product.ram : '-'}">RAM</span>
                        </p>

                        <p>
                            <strong>저장공간 :</strong>
                            <span th:text="${product.storageCapacity != null ? product.storageCapacity : '-'}">저장공간</span>
                        </p>

                        <p>
                            <strong>화면크기 :</strong>
                            <span th:text="${product.screenSize != null ? product.screenSize : '-'}">화면크기</span>
                        </p>

                        <p>
                            <strong>운영체제 :</strong>
                            <span th:text="${product.os != null ? product.os : '-'}">운영체제</span>
                        </p>

                        <p>
                            <strong>색상 :</strong>
                            <span th:text="${product.color != null ? product.color : '-'}">색상</span>
                        </p>

                        <div class="divider"></div>

                        <p>
                            <strong>설명 :</strong>
                        </p>

                        <p class="text-base leading-7 whitespace-pre-wrap"
                           th:text="${product.description != null ? product.description : '상품 설명이 없습니다.'}">
                            상품 설명
                        </p>

                    </div>

                </div>

                <!-- 상품 이미지 -->
                <div class="w-[450px] flex justify-center">

                    <img th:if="${product.imagePath != null}"
                         th:src="${product.imagePath}"
                         th:alt="${product.productName}"
                         class="w-full h-[450px] object-cover rounded-xl shadow-lg border">

                    <img th:if="${product.imagePath == null}"
                         src="/images/no-image.png"
                         alt="no-image"
                         class="w-full h-[450px] object-cover rounded-xl shadow-lg border">

                </div>

            </div>

            <div class="divider"></div>

            <div class="flex justify-end gap-3">

                <!-- 관리자 -->
                <th:block th:if="${loginMember != null and loginMember.role == 'ADMIN'}">

                    <a th:href="@{/product/modify(productId=${product.productId})}"
                       class="btn btn-success">
                        수정
                    </a>

                    <a th:href="@{/product/delete(productId=${product.productId})}"
                       class="btn btn-error"
                       onclick="return confirm('삭제하시겠습니까?');">
                        삭제
                    </a>

                    <a href="/product/list"
                       class="btn btn-primary">
                        목록
                    </a>

                </th:block>

                <!-- 일반회원 -->
                <th:block th:if="${loginMember != null and loginMember.role == 'USER'}">

                    <form action="/cart/add"
                          method="post"
                          th:if="${product.stock != null and product.stock > 0 and product.status == 'SALE'}">

                        <input type="hidden"
                               name="productId"
                               th:value="${product.productId}">

                        <input type="hidden"
                               name="quantity"
                               value="1">

                        <button type="submit"
                                class="btn btn-warning">
                            장바구니 담기
                        </button>

                    </form>

                    <button type="button"
                            class="btn btn-disabled"
                            th:if="${product.stock == null or product.stock <= 0 or product.status != 'SALE'}">
                        품절
                    </button>

                    <a href="/product/list"
                       class="btn btn-primary">
                        목록
                    </a>

                </th:block>

                <!-- 로그인 안 된 사용자 -->
                <th:block th:if="${loginMember == null}">

                    <a href="/member/login"
                       class="btn btn-warning">
                        로그인 후 장바구니 담기
                    </a>

                    <a href="/product/list"
                       class="btn btn-primary">
                        목록
                    </a>

                </th:block>

            </div>

        </div>

    </div>

</div>

</body>
</html>
