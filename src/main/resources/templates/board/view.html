<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" data-theme="light">
<head>
    <meta charset="UTF-8">
    <title>조은IT쇼핑몰 - 게시글 상세</title>

    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.24/dist/full.min.css" rel="stylesheet" type="text/css"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="/css/common/head.css">
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">

<div th:replace="~{common/head :: head}"></div>

<main class="max-w-5xl mx-auto px-4 py-10">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8 md:p-10">

        <h1 class="text-3xl font-bold text-gray-800 mb-6" th:text="${board.title}">게시글 제목</h1>

        <div class="flex gap-6 text-sm text-gray-500 mb-8 pb-6 border-b border-gray-100">
            <span th:text="'작성자: ' + ${board.writer}">홍길동</span>
            <span th:text="'등록일: ' + ${#temporals.format(board.createdAt, 'yyyy-MM-dd HH:mm')}">2026-06-16</span>
            <span th:text="'조회수: ' + ${board.viewCount}">0</span>
        </div>

        <div class="min-h-[300px] text-lg leading-relaxed text-gray-700 mb-10 whitespace-pre-wrap"
             th:text="${board.content}">
            게시글 내용이 들어갈 자리입니다.
        </div>

        <div class="flex gap-2">
            <a href="/board" class="btn btn-outline border-gray-200 hover:bg-gray-100">목록으로</a>
        </div>
        <div class="mt-10 border-t pt-8">
            <h3 class="text-xl font-bold mb-4">댓글</h3>

            <form action="/reply/write" method="post" class="flex gap-2 mb-6">
                <input type="hidden" name="boardNo" th:value="${board.boardNo}">

                <input type="text" name="writer" placeholder="작성자" class="input input-bordered w-32">
                <input type="text" name="content" placeholder="댓글을 입력하세요" class="input input-bordered flex-grow">
                <button type="submit" class="btn btn-primary">등록</button>
            </form>
            <div class="space-y-4">
                <div th:each="reply : ${replyList}" class="p-4 bg-gray-50 rounded-xl">
                    <div class="font-bold text-sm" th:text="${reply.writer}">작성자</div>
                    <div class="text-gray-700" th:text="${reply.content}">댓글 내용입니다.</div>
                </div>
            </div>
        </div>

</main>

</body>
</html>
