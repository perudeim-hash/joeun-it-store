<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 작성</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/common/head.css}">
</head>
<body class="bg-gray-50">
<div th:replace="~{common/head :: head}"></div>

<div class="container mx-auto px-4 mt-10" style="max-width: 800px;">
    <h2 class="text-2xl font-bold text-gray-800 mb-6 border-b pb-3">게시글 작성</h2>

    <form id="boardForm" action="/board/write" method="post" enctype="multipart/form-data" class="bg-white p-8 rounded-lg shadow-sm border border-gray-200">

        <div class="mb-5">
            <label class="block text-gray-700 font-bold mb-2">게시판 분류</label>
            <!-- ✨ 파라미터가 없거나 달라도 절대 500 에러가 나지 않는 안전한 검사 로직 적용 ✨ -->
            <select name="boardType" class="w-full border border-gray-300 rounded px-4 py-2 outline-none focus:border-blue-500" required>
                <option value="" disabled th:selected="${param.type == null}">게시판을 선택하세요</option>
                <option value="REVIEW" th:selected="${param.type != null and #strings.equals(param.type, 'REVIEW')}">리뷰 / 자유 게시판</option>
                <option value="QNA" th:selected="${param.type != null and #strings.equals(param.type, 'QNA')}">상품 문의 (Q&A)</option>

                <option value="INQUIRY" th:selected="${param.type != null and #strings.equals(param.type, 'INQUIRY')}">🔒 1:1 비밀 문의</option>

                <th:block th:if="${session.loggedMember != null and session.loggedMember.role == 'ADMIN'}">
                    <option value="NOTICE" class="font-bold text-red-600" th:selected="${param.type != null and #strings.equals(param.type, 'NOTICE')}">📢 공지사항</option>
                    <option value="FAQ" class="font-bold text-blue-600" th:selected="${param.type != null and #strings.equals(param.type, 'FAQ')}">💡 자주 묻는 질문 (FAQ)</option>
                </th:block>
            </select>
        </div>

        <div class="mb-5">
            <label class="block text-gray-700 font-bold mb-2">제목</label>
            <input type="text" name="title" class="w-full border border-gray-300 rounded px-4 py-2 outline-none focus:border-blue-500" placeholder="제목을 입력하세요" required>
        </div>

        <div class="mb-5">
            <label class="block text-gray-700 font-bold mb-2">사진 첨부 (최대 3장)</label>
            <div id="previewGrid" class="grid grid-cols-4 gap-4">
                <label class="w-32 h-32 border-2 border-dashed border-gray-300 flex flex-col items-center justify-center cursor-pointer hover:border-blue-500 text-gray-400">
                    <span class="text-3xl">+</span>
                    <span class="text-xs">사진 추가</span>
                    <input type="file" id="fileInput" name="files" multiple accept="image/*" class="hidden" onchange="handleFiles(this)">
                </label>
            </div>
            <p id="fileLimitText" class="text-xs text-red-500 mt-2 font-bold hidden">이미지는 최대 3장까지만 업로드 가능합니다.</p>
        </div>

        <div class="mb-6">
            <div class="flex justify-between items-end mb-2">
                <label class="block text-gray-700 font-bold">내용</label>
                <span id="writeContentCount" class="text-sm font-bold text-gray-400">0 / 500자</span>
            </div>
            <textarea name="content" rows="10" maxlength="500" class="w-full border border-gray-300 rounded px-4 py-3 outline-none focus:border-blue-500 resize-none" placeholder="내용을 입력하세요 (최대 500자)" required oninput="document.getElementById('writeContentCount').innerText = this.value.length + ' / 500자';"></textarea>
        </div>

        <div class="flex justify-end gap-3 mt-4">
            <button type="button" onclick="history.back()" class="px-6 py-2 border border-gray-300 rounded text-gray-700 font-bold hover:bg-gray-50">취소</button>
            <button type="submit" class="px-6 py-2 bg-blue-600 text-white rounded font-bold hover:bg-blue-700 shadow">등록하기</button>
        </div>
    </form>
</div>

<script>
    const dataTransfer = new DataTransfer();
    function handleFiles(input) {
        const grid = document.getElementById('previewGrid');
        const newFiles = Array.from(input.files);

        if (dataTransfer.items.length + newFiles.length > 3) {
            document.getElementById('fileLimitText').classList.remove('hidden');
            input.files = dataTransfer.files;
            return;
        } else {
            document.getElementById('fileLimitText').classList.add('hidden');
        }

        newFiles.forEach(file => {
            dataTransfer.items.add(file);
            const reader = new FileReader();
            reader.onload = function(e) {
                const div = document.createElement('div');
                div.className = 'relative w-32 h-32';
                div.innerHTML = `
                    <img src="${e.target.result}" class="w-full h-full object-cover rounded border">
                    <button type="button" onclick="removeFile(this, '${file.name}')" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-6 h-6 text-xs font-bold hover:bg-red-600">X</button>
                `;
                grid.insertBefore(div, grid.firstElementChild);
            }
            reader.readAsDataURL(file);
        });

        input.files = dataTransfer.files;
        if (dataTransfer.items.length >= 3) { grid.firstElementChild.classList.add('hidden'); }
    }

    function removeFile(btn, fileName) {
        const grid = document.getElementById('previewGrid');
        const fileInput = document.getElementById('fileInput');

        for (let i = 0; i < dataTransfer.items.length; i++) {
            if (dataTransfer.items[i].getAsFile().name === fileName) {
                dataTransfer.items.remove(i);
                break;
            }
        }
        fileInput.files = dataTransfer.files;
        btn.parentElement.remove();
        grid.firstElementChild.classList.remove('hidden');
        document.getElementById('fileLimitText').classList.add('hidden');
    }
</script>
</body>
</html>
