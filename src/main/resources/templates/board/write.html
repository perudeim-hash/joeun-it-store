<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" data-theme="light">
<head>
    <meta charset="UTF-8">
    <title>조은IT쇼핑몰 - Q&A 글쓰기</title>

    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.24/dist/full.min.css" rel="stylesheet" type="text/css"/>
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="/css/common/head.css">
</head>

<body class="bg-gray-50 text-gray-900 min-h-screen">

<div th:replace="~{common/head :: head}"></div>

<main class="max-w-3xl mx-auto px-4 py-12">

    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8 md:p-10">

        <div class="mb-8 pb-4 border-b border-gray-100">

            <h1 class="text-2xl font-bold text-gray-800 tracking-tight">
                Q&A 문의글 작성
            </h1>

            <p class="text-sm text-gray-400 mt-1">
                구매하시려는 상품이나 서비스에 대해 자유롭게 문의해 주세요.
            </p>

        </div>

        <form th:action="@{/board/write}"
              method="post"
              class="space-y-6">

            <input type="hidden"
                   name="boardType"
                   value="QNA">

            <div class="form-control w-full">

                <label class="label font-semibold text-gray-700 text-sm">
                    작성자
                </label>

                <div class="input input-bordered bg-gray-50 flex items-center rounded-xl text-gray-500">

                    <span th:if="${session.loggedMember != null}"
                          th:text="${session.loggedMember.nickname}">
                        로그인 회원
                    </span>

                    <span th:if="${session.loggedMember == null}">
                        로그인이 필요합니다
                    </span>

                </div>

            </div>

            <div class="form-control w-full">

                <label class="label font-semibold text-gray-700 text-sm">
                    제목
                </label>

                <input type="text"
                       id="title"
                       name="title"
                       placeholder="제목을 입력하세요"
                       class="input input-bordered focus:outline-none focus:border-blue-500 w-full rounded-xl"
                       required>

            </div>

            <div class="form-control w-full">

                <label class="label font-semibold text-gray-700 text-sm">
                    문의 내용
                </label>

                <textarea id="content"
                          name="content"
                          placeholder="문의하실 내용을 상세히 적어주세요."
                          class="textarea textarea-bordered focus:outline-none focus:border-blue-500 w-full h-48 rounded-xl resize-none"
                          required></textarea>

            </div>

            <div class="flex items-center justify-end gap-3 pt-4 border-t border-gray-100">

                <a th:href="@{/board}"
                   class="btn bg-gray-100 hover:bg-gray-200 border-none text-gray-600 px-6 rounded-xl flex items-center justify-center">
                    취소
                </a>

                <button type="submit"
                        class="btn btn-primary bg-blue-600 border-blue-600 hover:bg-blue-700 text-white px-8 shadow-md shadow-blue-100 rounded-xl">
                    등록하기
                </button>

            </div>

        </form>

    </div>

</main>

</body>
</html>
