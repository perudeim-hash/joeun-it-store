<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" data-theme="light">
<head>
    <meta charset="UTF-8">
    <title>주문 내역</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.24/dist/full.min.css" rel="stylesheet" type="text/css"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/common/head.css}">
    <!-- 기존 css도 유지하지만 Tailwind 위주로 렌더링 됩니다 -->
    <link rel="stylesheet" th:href="@{/css/order/order_list.css}">
    <script th:src="@{/js/order/order_list.js}" defer></script>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen">
<div th:replace="~{common/head :: head}"></div>

<div class="container mx-auto px-4 mt-12 mb-20" style="max-width: 1100px;">
    <!-- 상단 타이틀 및 총 결제 금액 요약 카드 -->
    <div class="flex flex-col md:flex-row justify-between items-end mb-8 gap-4">
        <div>
            <h1 class="text-3xl font-extrabold text-gray-900">📦 내 주문 내역</h1>
            <p class="text-gray-500 mt-2">지금까지 결제하신 주문 목록입니다.</p>
        </div>
        <div class="bg-blue-50 px-6 py-4 rounded-2xl border border-blue-100 shadow-sm flex items-center gap-4">
            <div class="p-3 bg-blue-100 rounded-full text-blue-600">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" /></svg>
            </div>
            <div>
                <span class="text-gray-600 font-bold block text-sm">총 결제 금액</span>
                <span class="text-2xl font-extrabold text-blue-700" th:text="${#numbers.formatInteger(totalSpent != null ? totalSpent : 0, 1, 'COMMA')} + ' 원'">0 원</span>
            </div>
        </div>
    </div>

    <!-- 주문 목록 테이블 -->
    <div class="card bg-white shadow-md border border-gray-200 overflow-hidden">
        <div class="overflow-x-auto">
            <table class="table table-zebra w-full text-center">
                <thead class="bg-gray-800 text-white text-sm">
                <tr>
                    <th class="py-4">주문번호</th>
                    <th>회원등급</th>
                    <th>주문상태</th>
                    <th>결제금액</th>
                    <th>관리</th>
                </tr>
                </thead>
                <tbody>
                <!-- 빈 상태 (주문 없음) -->
                <tr th:if="${#lists.isEmpty(orders)}">
                    <td colspan="5" class="py-16">
                        <div class="flex flex-col items-center gap-3">
                            <span class="text-4xl">🛒</span>
                            <p class="text-gray-500 font-medium">아직 주문하신 내역이 없습니다.</p>
                            <a href="/product/list" class="btn btn-primary btn-sm mt-2">쇼핑하러 가기</a>
                        </div>
                    </td>
                </tr>
                <!-- 주문 목록 -->
                <tr th:each="order : ${orders}" class="hover:bg-gray-50 transition">
                    <td class="py-4 font-bold text-blue-600 hover:underline">
                        <a th:href="@{'/order/detail/' + ${order.orderId}}" th:text="'#' + ${order.orderId}">#</a>
                    </td>
                    <td>
                        <span class="badge font-bold"
                              th:classappend="${order.memberMembership != null ? 'badge-' + #strings.toLowerCase(order.memberMembership) : 'badge-bronze'}"
                              th:text="${order.memberMembership != null ? order.memberMembership : 'BRONZE'}">
                        </span>
                    </td>
                    <td>
                        <div th:if="${order.orderStatus == 'ORDER_COMPLETE'}" class="badge badge-success gap-1 text-white font-bold p-3">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" /></svg>결제완료
                        </div>
                        <div th:if="${order.orderStatus == 'ORDER_CANCEL'}" class="badge badge-error gap-1 text-white font-bold p-3 line-through">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" /></svg>주문취소
                        </div>
                    </td>
                    <td class="font-extrabold text-gray-900 text-lg" th:text="${#numbers.formatInteger(order.finalPrice != null ? order.finalPrice : 0, 1, 'COMMA')} + ' 원'"></td>
                    <td>
                        <button type="button" th:if="${order.orderStatus != 'ORDER_CANCEL'}" class="btn btn-outline btn-error btn-sm font-bold" th:attr="onclick=|cancelOrder('${order.orderId}')|">주문 취소</button>
                        <button type="button" th:if="${order.orderStatus == 'ORDER_CANCEL'}" class="btn btn-ghost text-gray-400 hover:text-red-500 btn-sm font-bold" th:attr="onclick=|deleteOrderHistory('${order.orderId}')|">내역 삭제</button>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>

    <div class="mt-8 flex justify-center">
        <a href="/" class="btn btn-outline btn-wide font-bold">홈으로 돌아가기</a>
    </div>
</div>
</body>
</html>
