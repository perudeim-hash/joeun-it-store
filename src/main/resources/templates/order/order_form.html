<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>상품 주문서</title>
    <link rel="stylesheet" th:href="@{/css/common/head.css}">
    <link rel="stylesheet" th:href="@{/css/order/order_form.css}">
</head>
<body>
<div th:replace="~{common/head :: head}"></div>

<div class="order-wrapper">
    <div class="order-card">
        <h2>🛍️ 상품 주문서</h2>

        <div class="form-group">
            <label>상품 번호</label>
            <input type="number" id="productId" value="1">
        </div>

        <div class="form-group">
            <label>상품명</label>
            <input type="text" id="productName" value="갤럭시 S24">
        </div>

        <div class="form-group">
            <label>주문 수량</label>
            <input type="number" id="quantity" value="2" oninput="updateTotal()">
        </div>

        <div class="form-group">
            <label>상품 단가 (원)</label>
            <input type="number" id="orderPrice" value="1150000" oninput="updateTotal()">
        </div>

        <div class="total-price" id="totalPriceDisplay">총 결제금액: 2,300,000원</div>

        <button type="button" class="btn-pay" id="payBtn" onclick="placeOrder()">결제하기</button>
    </div>
</div>

<script th:src="@{/js/order/order_form.js}"></script>
</body>
</html>
