<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>주문 상세 | JOEUN IT STORE</title>
    <link rel="stylesheet" th:href="@{/css/common/head.css}">
    <style>
        .detail-container { max-width: 800px; margin: 50px auto; background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .section { margin-bottom: 30px; border-bottom: 1px solid #eee; padding-bottom: 20px; }
        h3 { color: #1f73d1; }
        .info-row { display: flex; justify-content: space-between; padding: 10px 0; }
        .price-box { background: #f8f9fa; padding: 20px; border-radius: 8px; }
    </style>
</head>
<body>
<div th:replace="~{common/head :: head}"></div>

<div class="detail-container">
    <h2>주문 상세 내역 <span th:text="'#' + ${order.orderId}"></span></h2>

    <div class="section">
        <h3>주문 정보</h3>
        <div class="info-row"><span>주문일자</span> <span th:text="${#dates.format(order.createdAt, 'yyyy-MM-dd HH:mm')}"></span></div>
        <div class="info-row"><span>주문상태</span> <strong th:text="${order.orderStatus}"></strong></div>
        <div class="info-row"><span>회원등급</span> <span th:text="${order.memberMembership}"></span></div>
    </div>

    <div class="section">
        <h3>구매 상품 목록</h3>
        <table>
            <thead><tr><th>상품명</th><th>단가</th><th>수량</th><th>합계</th></tr></thead>
            <tbody>
            <tr th:each="item : ${order.orderItems}">
                <td th:text="${item.productName}"></td>
                <td th:text="${#numbers.formatInteger(item.orderPrice, 3, 'COMMA')} + '원'"></td>
                <td th:text="${item.quantity}"></td>
                <td th:text="${#numbers.formatInteger(item.itemTotalPrice, 3, 'COMMA')} + '원'"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="section price-box">
        <h3>결제 금액 정보</h3>
        <div class="info-row"><span>총 상품금액</span> <span th:text="${#numbers.formatInteger(order.totalPrice, 3, 'COMMA')} + '원'"></span></div>
        <div class="info-row"><span>회원 할인금액</span> <span th:text="'-' + ${#numbers.formatInteger(order.discountPrice, 3, 'COMMA')} + '원'"></span></div>
        <div class="info-row" style="font-size: 1.2em; font-weight: bold;"><span>최종 결제금액</span> <span th:text="${#numbers.formatInteger(order.finalPrice, 3, 'COMMA')} + '원'"></span></div>
    </div>
</div>
</body>
</html>
