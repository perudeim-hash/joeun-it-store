<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" data-theme="light">
<head>
    <meta charset="UTF-8">
    <title>주문 상세 내역</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.24/dist/full.min.css" rel="stylesheet" type="text/css"/>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" th:href="@{/css/common/head.css}">
    <link rel="stylesheet" th:href="@{/css/order/order_detail.css}">
    <script th:src="@{/js/order/order_list.js}" defer></script>
</head>
<body class="bg-gray-50 text-gray-900">
<div th:replace="~{common/head :: head}"></div>

<main class="detail-container">
    <div class="flex justify-between items-end mb-6 border-b-2 border-gray-800 pb-4">
        <h2 class="text-3xl font-extrabold text-gray-900">📄 주문 상세 내역</h2>
        <span class="text-lg font-bold text-gray-500">주문번호 #[[${order.orderId}]]</span>
    </div>

    <section class="mb-8 p-6 bg-white rounded-xl shadow-sm border border-gray-200">
        <h3 class="section-title">주문 정보</h3>
        <div class="info-grid">
            <span class="info-label">주문 일자</span>
            <span class="info-value" th:text="${#temporals.format(order.createdAt, 'yyyy-MM-dd HH:mm')}"></span>

            <span class="info-label">주문 상태</span>
            <span class="info-value font-bold text-blue-600" th:text="${order.orderStatus}"></span>

            <span class="info-label">회원 등급</span>
            <span class="info-value text-lg font-black tracking-wide"
                  th:classappend="${order.memberMembership != null ? 'text-grade-' + #strings.toLowerCase(order.memberMembership) : 'text-grade-bronze'}"
                  th:text="${order.memberMembership}">
            </span>
        </div>
    </section>

    <section class="mb-8 p-6 bg-white rounded-xl shadow-sm border border-gray-200">
        <h3 class="section-title">주문 상품</h3>
        <div class="overflow-x-auto">
            <table class="table w-full">
                <thead class="bg-gray-50 text-gray-700 text-center text-sm border-b-2 border-gray-200">
                <tr>
                    <th class="py-3">상품명</th>
                    <th class="py-3">단가</th>
                    <th class="py-3">수량</th>
                    <th class="py-3">합계</th>
                </tr>
                </thead>
                <tbody class="text-center">
                <tr th:each="item : ${order.orderItems}" class="border-b border-gray-100 hover:bg-gray-50">
                    <td class="font-bold text-gray-900 py-4 text-left pl-4" th:text="${item.productName}"></td>
                    <td class="text-gray-600" th:text="${#numbers.formatInteger(item.orderPrice, 1, 'COMMA')} + '원'"></td>
                    <td class="font-bold" th:text="${item.quantity} + '개'"></td>
                    <td class="font-extrabold text-gray-900" th:text="${#numbers.formatInteger(item.itemTotalPrice, 1, 'COMMA')} + '원'"></td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mb-8">
        <section class="p-6 bg-white rounded-xl shadow-sm border border-gray-200">
            <h3 class="section-title">배송지 정보</h3>
            <div class="info-grid mt-4">
                <span class="info-label">수령인</span>
                <span class="info-value" th:text="${order.receiverName}"></span>

                <span class="info-label">연락처</span>
                <span class="info-value" th:text="${order.receiverPhone}"></span>

                <span class="info-label">배송 주소</span>
                <span class="info-value break-words">
                    <span class="text-sm text-gray-500 block mb-1" th:if="${order.zipcode != null and order.zipcode != 'null' and order.zipcode != ''}" th:text="'[' + ${order.zipcode} + ']'"></span>
                    [[${order.address}]] [[${order.detailAddress}]]
                </span>
            </div>
        </section>

        <section class="p-6 bg-blue-50 rounded-xl shadow-sm border border-blue-100 flex flex-col justify-center">
            <h3 class="section-title text-blue-900 border-b-2 border-blue-200">결제 요약</h3>
            <div class="flex justify-between items-center mt-4 mb-2">
                <span class="text-gray-600 font-bold">총 상품 금액</span>
                <span class="text-lg font-bold" th:text="${#numbers.formatInteger(order.totalPrice, 1, 'COMMA')} + '원'"></span>
            </div>

            <div class="flex justify-between items-center mb-4 text-red-500">
                <span class="font-bold">등급 할인 금액</span>

                <div class="flex items-center gap-2">
                    <span class="px-2 py-0.5 rounded text-xs font-bold bg-red-100 text-red-600"
                          th:if="${order.totalPrice > order.finalPrice}"
                          th:text="${#strings.toUpperCase(order.memberMembership) == 'VIP' ? '10%' :
                                    #strings.toUpperCase(order.memberMembership) == 'GOLD' ? '5%' :
                                    #strings.toUpperCase(order.memberMembership) == 'SILVER' ? '3%' :
                                    #strings.toUpperCase(order.memberMembership) == 'BRONZE' ? '1%' : '0%'} + ' 할인'">
                    </span>
                    <span class="font-bold" th:text="'-' + ${#numbers.formatInteger(order.totalPrice - order.finalPrice, 1, 'COMMA')} + '원'"></span>
                </div>
            </div>

            <div class="divider my-1 border-blue-200"></div>
            <div class="flex justify-between items-center mt-2">
                <span class="text-xl font-extrabold text-gray-900">최종 결제 금액</span>
                <span class="text-3xl font-extrabold text-blue-700" th:text="${#numbers.formatInteger(order.finalPrice, 1, 'COMMA')} + '원'"></span>
            </div>
        </section>
    </div>

    <div class="flex justify-center gap-3">
        <a href="/order/list" class="btn btn-outline btn-wide text-lg h-12">주문 목록으로</a>
        <button type="button" th:if="${order.orderStatus != 'ORDER_CANCEL'}"
                class="btn bg-red-500 hover:bg-red-600 text-white border-none btn-wide text-lg h-12"
                th:attr="onclick=|cancelOrder('${order.orderId}')|">
            이 주문 취소하기
        </button>
    </div>
</main>
</body>
</html>
