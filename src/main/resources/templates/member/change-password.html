<!DOCTYPE html>
<html lang="ko" data-theme="light" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 변경</title>

    <link rel="stylesheet" href="/css/common/head.css">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-[#f5f8fc] min-h-screen">

<div th:replace="~{common/head :: head}"></div>

<div class="flex justify-center py-16 px-4">

    <div class="w-full max-w-md">

        <div class="text-center mb-8">
            <h2 class="text-4xl font-extrabold text-[#0b1f3a]">
                비밀번호 변경
            </h2>
            <p class="mt-3 text-gray-500">
                안전한 계정 관리를 위해 비밀번호를 변경하세요.
            </p>
        </div>

        <div class="card bg-white shadow-xl border border-gray-100">
            <div class="card-body p-8">

                <div th:if="${message}"
                     class="alert alert-error mb-5">
                    <span th:text="${message}">오류 메시지</span>
                </div>

                <form action="/member/change-password" method="post">

                    <div class="form-control mb-5">
                        <label class="label">
                            <span class="label-text font-semibold">현재 비밀번호</span>
                        </label>
                        <input type="password"
                               name="currentPassword"
                               class="input input-bordered w-full focus:outline-none focus:border-[#0066cc]"
                               required>
                    </div>

                    <div class="form-control mb-5">
                        <label class="label">
                            <span class="label-text font-semibold">새 비밀번호</span>
                        </label>
                        <input type="password"
                               id="newPassword"
                               name="newPassword"
                               class="input input-bordered w-full focus:outline-none focus:border-[#0066cc]"
                               required>
                    </div>

                    <div class="form-control mb-6">
                        <label class="label">
                            <span class="label-text font-semibold">새 비밀번호 확인</span>
                        </label>
                        <input type="password"
                               id="newPasswordConfirm"
                               name="newPasswordConfirm"
                               class="input input-bordered w-full focus:outline-none focus:border-[#0066cc]"
                               required>

                        <p id="password-message" class="text-sm mt-1"></p>
                    </div>

                    <button class="btn w-full bg-[#0066cc] hover:bg-[#0052a3] text-white border-none">
                        비밀번호 변경
                    </button>

                </form>

                <div class="divider my-6">MENU</div>

                <div class="grid grid-cols-2 gap-3">
                    <a href="/member/mypage" class="btn btn-outline">
                        마이페이지
                    </a>

                    <a href="/" class="btn btn-outline">
                        메인페이지
                    </a>
                </div>

            </div>
        </div>

    </div>

</div>

<script>
    const newPassword = document.querySelector("#newPassword");
    const newPasswordConfirm = document.querySelector("#newPasswordConfirm");
    const passwordMessage = document.querySelector("#password-message");

    newPasswordConfirm.addEventListener("keyup", function () {
        if (newPassword.value === newPasswordConfirm.value) {
            passwordMessage.innerText = "새 비밀번호가 일치합니다.";
            passwordMessage.className = "text-sm mt-1 text-success";
        } else {
            passwordMessage.innerText = "새 비밀번호가 일치하지 않습니다.";
            passwordMessage.className = "text-sm mt-1 text-error";
        }
    });
</script>

</body>
</html>
