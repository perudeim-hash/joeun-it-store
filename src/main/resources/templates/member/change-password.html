<!DOCTYPE html>
<html lang="ko" data-theme="light" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>비밀번호 변경</title>

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-base-200 min-h-screen flex items-center justify-center">

<div class="card bg-base-100 w-full max-w-md shadow-2xl">
    <div class="card-body">

        <h2 class="text-3xl font-bold text-center mb-5">
            비밀번호 변경
        </h2>

        <div th:if="${message}" class="alert alert-error mb-4">
            <span th:text="${message}">오류 메시지</span>
        </div>

        <form action="/member/change-password" method="post">

            <div class="form-control mb-3">
                <label class="label">현재 비밀번호</label>
                <input type="password"
                       name="currentPassword"
                       class="input input-bordered w-full"
                       required>
            </div>

            <div class="form-control mb-3">
                <label class="label">새 비밀번호</label>
                <input type="password"
                       id="newPassword"
                       name="newPassword"
                       class="input input-bordered w-full"
                       required>
            </div>

            <div class="form-control mb-5">
                <label class="label">새 비밀번호 확인</label>
                <input type="password"
                       id="newPasswordConfirm"
                       name="newPasswordConfirm"
                       class="input input-bordered w-full"
                       required>

                <p id="password-message" class="text-sm mt-1"></p>
            </div>

            <button class="btn btn-primary w-full">
                비밀번호 변경
            </button>

        </form>

        <div class="divider">MENU</div>

        <div class="flex gap-2">
            <a href="/member/mypage" class="btn btn-outline flex-1">
                마이페이지
            </a>

            <a href="/" class="btn btn-ghost flex-1">
                메인페이지
            </a>
        </div>

    </div>
</div>

<script>
    const newPassword = document.querySelector("#newPassword");
    const newPasswordConfirm = document.querySelector("#newPasswordConfirm");
    const passwordMessage = document.querySelector("#password-message");

    newPasswordConfirm.addEventListener("keyup", function () {
        if (newPassword.value === newPasswordConfirm.value) {
            passwordMessage.innerText = "새 비밀번호가 일치합니다.";
            passwordMessage.className = "text-sm mt-1 text-success";
        } else {
            passwordMessage.innerText = "새 비밀번호가 일치하지 않습니다.";
            passwordMessage.className = "text-sm mt-1 text-error";
        }
    });
</script>

</body>
</html>
