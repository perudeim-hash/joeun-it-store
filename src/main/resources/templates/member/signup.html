<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-base-200 min-h-screen flex items-center justify-center py-3">

<div class="card bg-base-100 w-full max-w-lg shadow-2xl">
    <div class="card-body">

        <h2 class="text-3xl font-bold text-center mb-4">회원가입</h2>

        <form action="/member/signup" method="post">

            <div class="form-control mb-3">
                <label class="label">아이디</label>
                <div class="flex gap-2">
                    <input type="text" id="loginId" name="loginId"
                           class="input input-bordered flex-1" required>
                    <button type="button" id="btn-id-check"
                            class="btn btn-outline w-28">
                        중복확인
                    </button>
                </div>
                <p id="id-check-message" class="text-sm mt-1"></p>
            </div>

            <div class="form-control mb-3">
                <label class="label">비밀번호</label>
                <input type="password" id="password" name="password"
                       class="input input-bordered w-full" required>
            </div>

            <div class="form-control mb-3">
                <label class="label">비밀번호 확인</label>
                <input type="password" id="passwordConfirm"
                       class="input input-bordered w-full" required>
                <p id="password-message" class="text-sm mt-1"></p>
            </div>

            <div class="form-control mb-3">
                <label class="label">닉네임</label>
                <div class="flex gap-2">
                    <input type="text" id="nickname" name="nickname"
                           class="input input-bordered flex-1" required>
                    <button type="button" id="btn-nickname-check"
                            class="btn btn-outline w-28">
                        중복확인
                    </button>
                </div>
                <p id="nickname-check-message" class="text-sm mt-1"></p>
            </div>

            <div class="form-control mb-3">
                <label class="label">이메일</label>
                <div class="flex gap-2">
                    <input type="email" id="email" name="email"
                           class="input input-bordered flex-1">
                    <button type="button" id="btn-email-check"
                            class="btn btn-outline w-28">
                        중복확인
                    </button>
                </div>
                <p id="email-check-message" class="text-sm mt-1"></p>
            </div>

            <div class="form-control mb-3">
                <label class="label">전화번호</label>
                <input type="text" name="phone"
                       class="input input-bordered w-full">
            </div>

            <div class="form-control mb-3">
                <label class="label">우편번호</label>
                <div class="flex gap-2">
                    <input type="text" id="zipcode" name="zipcode"
                           class="input input-bordered flex-1">
                    <button type="button" onclick="searchPostcode()"
                            class="btn btn-outline w-28">
                        검색
                    </button>
                </div>
            </div>

            <div class="form-control mb-3">
                <label class="label">주소</label>
                <input type="text" id="address" name="address"
                       class="input input-bordered w-full">
            </div>

            <div class="form-control mb-4">
                <label class="label">상세주소</label>
                <input type="text" id="detailAddress" name="detailAddress"
                       class="input input-bordered w-full">
            </div>

            <button class="btn btn-primary w-full">
                회원가입
            </button>

        </form>

        <div class="divider my-2">MENU</div>

        <div class="flex gap-2">
            <a href="/" class="btn btn-ghost flex-1">메인페이지</a>
            <a href="/member/login" class="btn btn-outline flex-1">로그인</a>
        </div>

    </div>
</div>

<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>

<script>
    const password = document.querySelector("#password");
    const passwordConfirm = document.querySelector("#passwordConfirm");
    const passwordMessage = document.querySelector("#password-message");

    passwordConfirm.addEventListener("keyup", function () {
        if (password.value === passwordConfirm.value) {
            passwordMessage.innerText = "비밀번호가 일치합니다.";
            passwordMessage.className = "text-sm mt-1 text-success";
        } else {
            passwordMessage.innerText = "비밀번호가 일치하지 않습니다.";
            passwordMessage.className = "text-sm mt-1 text-error";
        }
    });

    function checkDuplicate(url, paramName, value, messageSelector, successText, failText) {
        const message = document.querySelector(messageSelector);

        if (value.trim() === "") {
            message.innerText = "값을 입력하세요.";
            message.className = "text-sm mt-1 text-error";
            return;
        }

        fetch(url, {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded"
            },
            body: paramName + "=" + encodeURIComponent(value)
        })
            .then(response => response.json())
            .then(data => {
                if (data.available) {
                    message.innerText = successText;
                    message.className = "text-sm mt-1 text-success";
                } else {
                    message.innerText = failText;
                    message.className = "text-sm mt-1 text-error";
                }
            });
    }

    document.querySelector("#btn-id-check").addEventListener("click", function () {
        checkDuplicate(
            "/member/id-check",
            "loginId",
            document.querySelector("#loginId").value,
            "#id-check-message",
            "사용 가능한 아이디입니다.",
            "이미 사용중인 아이디입니다."
        );
    });

    document.querySelector("#btn-email-check").addEventListener("click", function () {
        checkDuplicate(
            "/member/email-check",
            "email",
            document.querySelector("#email").value,
            "#email-check-message",
            "사용 가능한 이메일입니다.",
            "이미 사용중인 이메일입니다."
        );
    });

    document.querySelector("#btn-nickname-check").addEventListener("click", function () {
        checkDuplicate(
            "/member/nickname-check",
            "nickname",
            document.querySelector("#nickname").value,
            "#nickname-check-message",
            "사용 가능한 닉네임입니다.",
            "이미 사용중인 닉네임입니다."
        );
    });

    function searchPostcode() {
        new daum.Postcode({
            oncomplete: function (data) {
                document.querySelector("#zipcode").value = data.zonecode;
                document.querySelector("#address").value = data.address;
                document.querySelector("#detailAddress").focus();
            }
        }).open();
    }
</script>

</body>
</html>
