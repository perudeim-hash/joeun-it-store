<!DOCTYPE html>
<html lang="ko" data-theme="light" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>

    <link rel="stylesheet" href="/css/common/head.css">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-[#f5f8fc] min-h-screen">

<div th:replace="~{common/head :: head}"></div>

<div class="flex justify-center py-14 px-4">
    <div class="w-full max-w-xl">

        <div class="text-center mb-8">
            <h2 class="text-4xl font-extrabold text-[#0b1f3a]">회원가입</h2>
            <p class="mt-3 text-gray-500">
                조은IT 쇼핑몰 회원이 되어 다양한 혜택을 받아보세요.
            </p>
        </div>

        <div class="card bg-white shadow-xl border border-gray-100">
            <div class="card-body p-8">

                <div th:if="${signupError}" class="alert alert-error mb-5">
                    <span th:text="${signupError}">아이디 형식 오류</span>
                </div>

                <form action="/member/signup"
                      method="post"
                      onsubmit="return validateBeforeSubmit();">

                    <div class="form-control mb-4">
                        <label class="label">
                            <span class="label-text font-semibold">아이디</span>
                        </label>

                        <div class="flex gap-2">
                            <input type="text"
                                   id="loginId"
                                   name="loginId"
                                   placeholder="영문 소문자, 숫자, _ 4~20자"
                                   class="input input-bordered flex-1 focus:outline-none focus:border-[#0066cc]"
                                   pattern="^[a-z0-9_]{4,20}$"
                                   title="아이디는 영문 소문자, 숫자, _ 만 4~20자로 입력하세요."
                                   required>

                            <button type="button"
                                    id="btn-id-check"
                                    class="btn btn-outline border-[#0066cc] text-[#0066cc] hover:bg-[#0066cc] hover:text-white w-28">
                                중복확인
                            </button>
                        </div>

                        <p id="id-check-message" class="text-sm mt-1"></p>
                    </div>

                    <div class="form-control mb-4">
                        <label class="label">
                            <span class="label-text font-semibold">비밀번호</span>
                        </label>

                        <div class="flex gap-2">
                            <input type="password"
                                   id="password"
                                   name="password"
                                   placeholder="영문, 숫자, 특수문자 포함 8자 이상"
                                   class="input input-bordered flex-1 focus:outline-none focus:border-[#0066cc]"
                                   required>

                            <button type="button"
                                    id="btn-password-toggle"
                                    class="btn btn-outline w-20">
                                보기
                            </button>
                        </div>

                        <p id="password-condition-message" class="text-sm mt-1"></p>
                    </div>

                    <div class="form-control mb-4">
                        <label class="label">
                            <span class="label-text font-semibold">비밀번호 확인</span>
                        </label>

                        <div class="flex gap-2">
                            <input type="password"
                                   id="passwordConfirm"
                                   placeholder="비밀번호를 다시 입력하세요"
                                   class="input input-bordered flex-1 focus:outline-none focus:border-[#0066cc]"
                                   required>

                            <button type="button"
                                    id="btn-password-confirm-toggle"
                                    class="btn btn-outline w-20">
                                보기
                            </button>
                        </div>

                        <p id="password-message" class="text-sm mt-1"></p>
                    </div>

                    <div class="form-control mb-4">
                        <label class="label">
                            <span class="label-text font-semibold">닉네임</span>
                        </label>

                        <div class="flex gap-2">
                            <input type="text"
                                   id="nickname"
                                   name="nickname"
                                   placeholder="닉네임을 입력하세요"
                                   class="input input-bordered flex-1 focus:outline-none focus:border-[#0066cc]"
                                   required>

                            <button type="button"
                                    id="btn-nickname-check"
                                    class="btn btn-outline border-[#0066cc] text-[#0066cc] hover:bg-[#0066cc] hover:text-white w-28">
                                중복확인
                            </button>
                        </div>

                        <p id="nickname-check-message" class="text-sm mt-1"></p>
                    </div>

                    <div class="form-control mb-4">
                        <label class="label">
                            <span class="label-text font-semibold">이메일</span>
                        </label>

                        <div class="flex gap-2">
                            <input type="text"
                                   id="emailId"
                                   placeholder="이메일"
                                   class="input input-bordered flex-1 focus:outline-none focus:border-[#0066cc]">

                            <span class="flex items-center">@</span>

                            <select id="emailDomain"
                                    class="select select-bordered w-44">
                                <option value="naver.com">naver.com</option>
                                <option value="gmail.com">gmail.com</option>
                                <option value="daum.net">daum.net</option>
                                <option value="kakao.com">kakao.com</option>
                                <option value="직접입력">직접입력</option>
                            </select>

                            <button type="button"
                                    id="btn-email-check"
                                    class="btn btn-outline border-[#0066cc] text-[#0066cc] hover:bg-[#0066cc] hover:text-white w-28">
                                중복확인
                            </button>
                        </div>

                        <input type="text"
                               id="customDomain"
                               placeholder="예: naver.com"
                               class="input input-bordered mt-2 hidden">

                        <p id="email-format-message" class="text-sm mt-1"></p>

                        <input type="hidden"
                               id="email"
                               name="email">

                        <p id="email-check-message" class="text-sm mt-1"></p>
                    </div>

                    <div class="form-control mb-4">
                        <label class="label">
                            <span class="label-text font-semibold">전화번호</span>
                        </label>

                        <div class="flex gap-2">
                            <input type="text"
                                   value="010"
                                   class="input input-bordered w-20 bg-gray-100"
                                   readonly>

                            <input type="text"
                                   id="phoneMiddle"
                                   placeholder="1234"
                                   maxlength="4"
                                   class="input input-bordered flex-1"
                                   required>

                            <input type="text"
                                   id="phoneLast"
                                   placeholder="5678"
                                   maxlength="4"
                                   class="input input-bordered flex-1"
                                   required>
                        </div>

                        <input type="hidden"
                               id="phone"
                               name="phone">
                    </div>

                    <div class="form-control mb-4">
                        <label class="label">
                            <span class="label-text font-semibold">우편번호</span>
                        </label>

                        <div class="flex gap-2">
                            <input type="text"
                                   id="zipcode"
                                   name="zipcode"
                                   class="input input-bordered flex-1 focus:outline-none focus:border-[#0066cc]">

                            <button type="button"
                                    onclick="searchPostcode()"
                                    class="btn btn-outline border-[#0066cc] text-[#0066cc] hover:bg-[#0066cc] hover:text-white w-28">
                                검색
                            </button>
                        </div>
                    </div>

                    <div class="form-control mb-4">
                        <label class="label">
                            <span class="label-text font-semibold">주소</span>
                        </label>

                        <input type="text"
                               id="address"
                               name="address"
                               class="input input-bordered w-full focus:outline-none focus:border-[#0066cc]">
                    </div>

                    <div class="form-control mb-6">
                        <label class="label">
                            <span class="label-text font-semibold">상세주소</span>
                        </label>

                        <input type="text"
                               id="detailAddress"
                               name="detailAddress"
                               class="input input-bordered w-full focus:outline-none focus:border-[#0066cc]">
                    </div>

                    <button class="btn w-full bg-[#0066cc] hover:bg-[#0052a3] text-white border-none">
                        회원가입
                    </button>

                </form>

                <div class="divider my-6">또는</div>

                <div class="grid grid-cols-2 gap-3">
                    <a href="/" class="btn btn-outline">메인페이지</a>

                    <a href="/member/login"
                       class="btn btn-outline border-[#0066cc] text-[#0066cc] hover:bg-[#0066cc] hover:text-white">
                        로그인
                    </a>
                </div>
                <div class="flex justify-center items-center gap-3 mt-6 text-sm text-gray-500">

                    <a href="/member/find-id"
                       class="hover:text-[#0066cc] transition">
                        아이디 찾기
                    </a>

                    <span>|</span>

                    <a href="/member/find-password"
                       class="hover:text-[#0066cc] transition">
                        비밀번호 찾기
                    </a>

                </div>

            </div>
        </div>

    </div>
</div>

<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>

<script>
    const loginId = document.querySelector("#loginId");
    const idCheckMessage = document.querySelector("#id-check-message");

    loginId.addEventListener("keyup", function () {
        const regex = /^[a-z0-9_]{4,20}$/;

        if (loginId.value.trim() === "") {
            idCheckMessage.innerText = "";
            return;
        }

        if (!regex.test(loginId.value)) {
            idCheckMessage.innerText =
                "아이디는 영문 소문자, 숫자, _ 만 4~20자로 입력하세요.";
            idCheckMessage.className = "text-sm mt-1 text-error";
        } else {
            idCheckMessage.innerText =
                "아이디 형식이 올바릅니다. 중복확인을 해주세요.";
            idCheckMessage.className = "text-sm mt-1 text-success";
        }
    });

    const password = document.querySelector("#password");
    const passwordConfirm = document.querySelector("#passwordConfirm");
    const passwordMessage = document.querySelector("#password-message");
    const passwordConditionMessage = document.querySelector("#password-condition-message");
    const btnPasswordToggle = document.querySelector("#btn-password-toggle");
    const btnPasswordConfirmToggle = document.querySelector("#btn-password-confirm-toggle");

    function validatePassword() {
        const regex =
            /^(?=.*[A-Za-z])(?=.*\d)(?=.*[!@#$%^&*()_+\-=\[\]{};':"\\|,.<>\/?]).{8,}$/;

        if (password.value.trim() === "") {
            passwordConditionMessage.innerText = "";
            return false;
        }

        if (!regex.test(password.value)) {
            passwordConditionMessage.innerText =
                "비밀번호는 영문, 숫자, 특수문자를 포함해 8자 이상 입력하세요.";
            passwordConditionMessage.className =
                "text-sm mt-1 text-error";
            return false;
        }

        passwordConditionMessage.innerText =
            "사용 가능한 비밀번호입니다.";
        passwordConditionMessage.className =
            "text-sm mt-1 text-success";
        return true;
    }

    function checkPasswordConfirm() {
        if (passwordConfirm.value.trim() === "") {
            passwordMessage.innerText = "";
            return false;
        }

        if (password.value === passwordConfirm.value) {
            passwordMessage.innerText = "비밀번호가 일치합니다.";
            passwordMessage.className = "text-sm mt-1 text-success";
            return true;
        }

        passwordMessage.innerText = "비밀번호가 일치하지 않습니다.";
        passwordMessage.className = "text-sm mt-1 text-error";
        return false;
    }

    password.addEventListener("keyup", function () {
        validatePassword();
        checkPasswordConfirm();
    });

    passwordConfirm.addEventListener("keyup", checkPasswordConfirm);

    btnPasswordToggle.addEventListener("click", function () {
        if (password.type === "password") {
            password.type = "text";
            this.innerText = "숨김";
        } else {
            password.type = "password";
            this.innerText = "보기";
        }
    });

    btnPasswordConfirmToggle.addEventListener("click", function () {
        if (passwordConfirm.type === "password") {
            passwordConfirm.type = "text";
            this.innerText = "숨김";
        } else {
            passwordConfirm.type = "password";
            this.innerText = "보기";
        }
    });

    function checkDuplicate(url, paramName, value, messageSelector, successText, failText) {
        const message = document.querySelector(messageSelector);

        if (value.trim() === "") {
            message.innerText = "값을 입력하세요.";
            message.className = "text-sm mt-1 text-error";
            return;
        }

        fetch(url, {
            method: "POST",
            headers: {
                "Content-Type": "application/x-www-form-urlencoded"
            },
            body: paramName + "=" + encodeURIComponent(value)
        })
            .then(response => response.json())
            .then(data => {
                if (data.available) {
                    message.innerText = successText;
                    message.className = "text-sm mt-1 text-success";
                } else {
                    message.innerText = failText;
                    message.className = "text-sm mt-1 text-error";
                }
            });
    }

    document.querySelector("#btn-id-check").addEventListener("click", function () {
        const regex = /^[a-z0-9_]{4,20}$/;
        const value = document.querySelector("#loginId").value;

        if (!regex.test(value)) {
            idCheckMessage.innerText =
                "아이디는 영문 소문자, 숫자, _ 만 4~20자로 입력하세요.";
            idCheckMessage.className = "text-sm mt-1 text-error";
            return;
        }

        checkDuplicate(
            "/member/id-check",
            "loginId",
            value,
            "#id-check-message",
            "사용 가능한 아이디입니다.",
            "이미 사용중인 아이디입니다."
        );
    });

    document.querySelector("#btn-nickname-check").addEventListener("click", function () {
        checkDuplicate(
            "/member/nickname-check",
            "nickname",
            document.querySelector("#nickname").value,
            "#nickname-check-message",
            "사용 가능한 닉네임입니다.",
            "이미 사용중인 닉네임입니다."
        );
    });

    const emailId = document.querySelector("#emailId");
    const emailDomain = document.querySelector("#emailDomain");
    const customDomain = document.querySelector("#customDomain");
    const email = document.querySelector("#email");
    const emailFormatMessage = document.querySelector("#email-format-message");

    function makeEmailValue() {
        const emailRegex = /^[a-zA-Z0-9._%+-]+$/;
        const domainRegex = /^[a-zA-Z0-9-]+(\.[a-zA-Z0-9-]+)+$/;

        let idValue = emailId.value.trim();
        let domain = emailDomain.value;

        if (domain === "직접입력") {
            domain = customDomain.value.trim();
        }

        if (idValue === "" || domain === "") {
            email.value = "";
            emailFormatMessage.innerText = "";
            return;
        }

        if (!emailRegex.test(idValue)) {
            email.value = "";
            emailFormatMessage.innerText =
                "이메일 아이디 형식이 올바르지 않습니다.";
            emailFormatMessage.className = "text-sm mt-1 text-error";
            return;
        }

        if (!domainRegex.test(domain)) {
            email.value = "";
            emailFormatMessage.innerText =
                "도메인은 naver.com 형식으로 입력해주세요.";
            emailFormatMessage.className = "text-sm mt-1 text-error";
            return;
        }

        email.value = idValue + "@" + domain;

        emailFormatMessage.innerText = "올바른 이메일 형식입니다.";
        emailFormatMessage.className = "text-sm mt-1 text-success";
    }

    function validateBeforeSubmit() {
        makeEmailValue();

        if (email.value.trim() === "") {
            emailFormatMessage.innerText =
                "올바른 이메일을 입력해주세요.";
            emailFormatMessage.className =
                "text-sm mt-1 text-error";
            return false;
        }

        if (!validatePassword()) {
            return false;
        }

        if (!checkPasswordConfirm()) {
            return false;
        }

        makePhoneNumber();

        return true;
    }

    emailId.addEventListener("input", makeEmailValue);

    emailDomain.addEventListener("change", function () {
        if (emailDomain.value === "직접입력") {
            customDomain.classList.remove("hidden");
        } else {
            customDomain.classList.add("hidden");
            customDomain.value = "";
        }

        makeEmailValue();
    });

    customDomain.addEventListener("input", makeEmailValue);

    document.querySelector("#btn-email-check").addEventListener("click", function () {
        makeEmailValue();

        checkDuplicate(
            "/member/email-check",
            "email",
            document.querySelector("#email").value,
            "#email-check-message",
            "사용 가능한 이메일입니다.",
            "이미 사용중인 이메일입니다."
        );
    });

    const phoneMiddle = document.querySelector("#phoneMiddle");
    const phoneLast = document.querySelector("#phoneLast");
    const phone = document.querySelector("#phone");

    function makePhoneNumber() {
        phone.value =
            "010-" +
            phoneMiddle.value +
            "-" +
            phoneLast.value;
    }

    phoneMiddle.addEventListener("input", function () {
        this.value = this.value.replace(/[^0-9]/g, "");
        makePhoneNumber();
    });

    phoneLast.addEventListener("input", function () {
        this.value = this.value.replace(/[^0-9]/g, "");
        makePhoneNumber();
    });

    function searchPostcode() {
        new daum.Postcode({
            oncomplete: function (data) {
                document.querySelector("#zipcode").value = data.zonecode;
                document.querySelector("#address").value = data.address;
                document.querySelector("#detailAddress").focus();
            }
        }).open();
    }
</script>

</body>
</html>
