<!DOCTYPE html>
<html lang="ko" data-theme="light" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>마이페이지</title>

    <link rel="stylesheet" href="/css/common/head.css">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-[#f5f8fc] min-h-screen">

<div th:replace="~{common/head :: head}"></div>

<div class="max-w-5xl mx-auto py-14 px-4">

    <div class="text-center mb-8">
        <h2 class="text-4xl font-extrabold text-[#0b1f3a]">
            마이페이지
        </h2>

        <p class="mt-3 text-gray-500">
            회원정보를 확인하고 관리할 수 있습니다.
        </p>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">

        <div class="card bg-white shadow-xl border border-gray-100">
            <div class="card-body items-center text-center p-8">

                <div class="avatar placeholder">
                    <div class="bg-[#0066cc] text-white rounded-full w-24 h-24 flex items-center justify-center">
                        <span class="text-4xl font-bold leading-none"
                              th:text="${#strings.substring(memberDto.nickname,0,1)}">
                            홍
                        </span>
                    </div>
                </div>

                <h3 class="text-2xl font-bold text-[#0b1f3a] mt-4">
                    <span th:text="${memberDto.nickname}">홍길동</span>님
                </h3>

                <div class="badge bg-[#0066cc] text-white border-none mt-2"
                     th:text="${memberDto.membership}">
                    SILVER
                </div>

                <p class="text-sm text-gray-500 mt-4">
                    조은IT 쇼핑몰 회원정보
                </p>

                <div th:if="${memberDto.role == 'ADMIN'}"
                     class="badge badge-error badge-outline mt-2">
                    관리자 계정
                </div>

            </div>
        </div>

        <div class="card bg-white shadow-xl border border-gray-100 lg:col-span-2">
            <div class="card-body p-8">

                <div class="mb-5">
                    <h3 class="text-2xl font-bold text-[#0b1f3a]">
                        회원정보
                    </h3>

                    <p class="text-sm text-gray-500 mt-1">
                        가입된 기본 회원 정보입니다.
                    </p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

                    <div class="bg-[#f5f8fc] rounded-xl p-4 border border-gray-100">
                        <div class="text-sm text-gray-500 mb-1">아이디</div>
                        <div class="font-bold text-[#0b1f3a]"
                             th:text="${memberDto.loginId}">
                            test01
                        </div>
                    </div>

                    <div class="bg-[#f5f8fc] rounded-xl p-4 border border-gray-100">
                        <div class="text-sm text-gray-500 mb-1">닉네임</div>
                        <div class="font-bold text-[#0b1f3a]"
                             th:text="${memberDto.nickname}">
                            홍길동
                        </div>
                    </div>

                    <div class="bg-[#f5f8fc] rounded-xl p-4 border border-gray-100">
                        <div class="text-sm text-gray-500 mb-1">이메일</div>
                        <div class="font-bold text-[#0b1f3a]"
                             th:text="${memberDto.email}">
                            test@test.com
                        </div>
                    </div>

                    <div class="bg-[#f5f8fc] rounded-xl p-4 border border-gray-100">
                        <div class="text-sm text-gray-500 mb-1">전화번호</div>
                        <div class="font-bold text-[#0b1f3a]"
                             th:text="${memberDto.phone}">
                            010-1111-1111
                        </div>
                    </div>

                    <div class="bg-[#f5f8fc] rounded-xl p-4 border border-gray-100 md:col-span-2">
                        <div class="text-sm text-gray-500 mb-1">주소</div>
                        <div class="font-bold text-[#0b1f3a]">
                            <span th:text="${memberDto.zipcode}">12345</span>
                            <span th:text="${memberDto.address}">주소</span>
                            <span th:text="${memberDto.detailAddress}">상세주소</span>
                        </div>
                    </div>

                    <div class="bg-[#f5f8fc] rounded-xl p-4 border border-gray-100">
                        <div class="text-sm text-gray-500 mb-1">회원등급</div>
                        <div class="font-bold text-[#0066cc]"
                             th:text="${memberDto.membership}">
                            SILVER
                        </div>
                    </div>

                    <div class="bg-[#f5f8fc] rounded-xl p-4 border border-gray-100">
                        <div class="text-sm text-gray-500 mb-1">권한</div>
                        <div class="font-bold text-[#0b1f3a]"
                             th:text="${memberDto.role}">
                            USER
                        </div>
                    </div>

                    <div class="bg-[#f5f8fc] rounded-xl p-4 border border-gray-100">
                        <div class="text-sm text-gray-500 mb-1">가입일</div>
                        <div class="font-bold text-[#0b1f3a]"
                             th:text="${#temporals.format(memberDto.createdAt,'yyyy-MM-dd HH:mm')}">
                            2026-06-11 14:00
                        </div>
                    </div>

                    <div class="bg-[#f5f8fc] rounded-xl p-4 border border-gray-100">
                        <div class="text-sm text-gray-500 mb-1">최근 수정일</div>

                        <div class="font-bold text-[#0b1f3a]"
                             th:if="${memberDto.updatedAt != null}"
                             th:text="${#temporals.format(memberDto.updatedAt,'yyyy-MM-dd HH:mm')}">
                            2026-06-11 15:00
                        </div>

                        <div class="font-bold text-gray-400"
                             th:if="${memberDto.updatedAt == null}">
                            수정 이력 없음
                        </div>
                    </div>

                </div>

            </div>
        </div>

    </div>

    <div class="card bg-white shadow-xl border border-gray-100 mt-6">
        <div class="card-body p-6">

            <div class="grid grid-cols-1 md:grid-cols-4 gap-3">

                <a href="/member/update"
                   class="btn bg-[#0066cc] hover:bg-[#0052a3] text-white border-none">
                    회원정보 수정
                </a>

                <a href="/member/change-password"
                   class="btn btn-outline border-[#0066cc] text-[#0066cc] hover:bg-[#0066cc] hover:text-white">
                    비밀번호 변경
                </a>

                <a href="/"
                   class="btn btn-outline">
                    메인페이지
                </a>

                <a href="/member/logout"
                   class="btn btn-error">
                    로그아웃
                </a>

            </div>

            <div th:if="${memberDto.role != 'ADMIN'}"
                 class="text-center mt-5">
                <a href="/member/delete"
                   class="btn btn-error btn-outline btn-sm">
                    회원탈퇴
                </a>
            </div>

            <div th:if="${memberDto.role == 'ADMIN'}"
                 class="alert bg-[#eaf4ff] border border-[#b9dcff] text-[#0b1f3a] mt-5">
                <span>
                    관리자 계정은 회원탈퇴가 제한됩니다.
                </span>
            </div>

        </div>
    </div>

</div>

</body>
</html>
