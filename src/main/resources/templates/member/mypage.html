<!DOCTYPE html>
<html lang="ko"
      data-theme="light"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>마이페이지</title>

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5"
          rel="stylesheet"/>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-base-200 min-h-screen flex items-center justify-center py-8">

<div class="card bg-base-100 w-full max-w-xl shadow-2xl">

    <div class="card-body">

        <div class="text-center">

            <div class="avatar placeholder mb-3">
                <div class="bg-primary text-primary-content rounded-full w-20">
                    <span class="text-3xl"
                          th:text="${#strings.substring(memberDto.nickname,0,1)}">
                        J
                    </span>
                </div>
            </div>

            <h2 class="text-3xl font-bold">
                <span th:text="${memberDto.nickname}">
                    닉네임
                </span>님
            </h2>

            <div class="badge badge-primary mt-2"
                 th:text="${memberDto.membership}">
                BRONZE
            </div>

            <p class="text-sm opacity-70 mt-2">
                회원정보를 확인하고 관리할 수 있습니다.
            </p>

        </div>

        <div class="divider">
            회원정보
        </div>

        <div class="space-y-3">

            <div class="flex justify-between border-b pb-2">
                <span class="font-bold">아이디</span>
                <span th:text="${memberDto.loginId}">test01</span>
            </div>

            <div class="flex justify-between border-b pb-2">
                <span class="font-bold">닉네임</span>
                <span th:text="${memberDto.nickname}">정웅</span>
            </div>

            <div class="flex justify-between border-b pb-2">
                <span class="font-bold">이메일</span>
                <span th:text="${memberDto.email}">test@test.com</span>
            </div>

            <div class="flex justify-between border-b pb-2">
                <span class="font-bold">전화번호</span>
                <span th:text="${memberDto.phone}">010-1234-5678</span>
            </div>

            <div class="border-b pb-2">
                <div class="font-bold mb-1">주소</div>

                <div class="text-right">
                    <span th:text="${memberDto.zipcode}">12345</span>
                    <span th:text="${memberDto.address}">주소</span>
                    <span th:text="${memberDto.detailAddress}">상세주소</span>
                </div>
            </div>

            <div class="flex justify-between border-b pb-2">
                <span class="font-bold">회원등급</span>
                <span th:text="${memberDto.membership}">BRONZE</span>
            </div>

            <div class="flex justify-between border-b pb-2">
                <span class="font-bold">권한</span>
                <span th:text="${memberDto.role}">USER</span>
            </div>

            <div class="flex justify-between border-b pb-2">
                <span class="font-bold">가입일</span>
                <span th:text="${#temporals.format(memberDto.createdAt,'yyyy-MM-dd HH:mm')}">
                    2026-06-11 14:00
                </span>
            </div>

            <div class="flex justify-between border-b pb-2">
                <span class="font-bold">최근 수정일</span>

                <span th:if="${memberDto.updatedAt != null}"
                      th:text="${#temporals.format(memberDto.updatedAt,'yyyy-MM-dd HH:mm')}">
                    2026-06-11 14:30
                </span>

                <span th:if="${memberDto.updatedAt == null}">
                    수정 이력 없음
                </span>
            </div>

        </div>

        <div class="divider">
            MENU
        </div>

        <div class="grid grid-cols-2 gap-2">

            <a href="/member/update"
               class="btn btn-primary">
                회원정보 수정
            </a>

            <a href="/member/change-password"
               class="btn btn-secondary">
                비밀번호 변경
            </a>

            <a href="/"
               class="btn btn-outline">
                메인페이지
            </a>

            <a href="/member/logout"
               class="btn btn-error">
                로그아웃
            </a>

        </div>

        <div class="divider"></div>

        <div class="text-center"
             th:if="${memberDto.role != 'ADMIN'}">

            <a href="/member/delete"
               class="btn btn-error btn-outline btn-sm">
                회원탈퇴
            </a>

        </div>

        <div th:if="${memberDto.role == 'ADMIN'}"
             class="alert alert-info mt-2">

            <span>
                관리자 계정은 회원탈퇴가 제한됩니다.
            </span>

        </div>

    </div>

</div>

</body>
</html>
