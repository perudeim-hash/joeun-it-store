<!DOCTYPE html>
<html lang="ko"
      data-theme="light"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>로그인</title>

    <link rel="stylesheet" href="/css/common/head.css">

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5"
          rel="stylesheet"/>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-[#f5f8fc] min-h-screen">

<div th:replace="~{common/head :: head}"></div>

<div class="flex justify-center py-16 px-4">

    <div class="w-full max-w-md">

        <div class="text-center mb-8">
            <h2 class="text-4xl font-extrabold text-[#0b1f3a]">
                로그인
            </h2>

            <p class="mt-3 text-gray-500">
                조은IT 쇼핑몰에 오신 것을 환영합니다.
            </p>
        </div>

        <div class="card bg-white shadow-xl border border-gray-100">

            <div class="card-body p-8">

                <div th:if="${loginError}"
                     class="alert alert-error mb-5">
                    <span th:text="${loginError}">
                        아이디 또는 비밀번호가 틀렸습니다.
                    </span>
                </div>

                <form action="/member/login"
                      method="post">

                    <div class="form-control mb-5">
                        <label class="label">
                            <span class="label-text font-semibold">
                                아이디
                            </span>
                        </label>

                        <input type="text"
                               name="loginId"
                               placeholder="아이디를 입력하세요"
                               class="input input-bordered w-full focus:outline-none focus:border-[#0066cc]"
                               required>
                    </div>

                    <div class="form-control mb-6">
                        <label class="label">
                            <span class="label-text font-semibold">
                                비밀번호
                            </span>
                        </label>

                        <input type="password"
                               name="password"
                               placeholder="비밀번호를 입력하세요"
                               class="input input-bordered w-full focus:outline-none focus:border-[#0066cc]"
                               required>
                    </div>

                    <button class="btn w-full bg-[#0066cc] hover:bg-[#0052a3] text-white border-none">
                        로그인
                    </button>

                </form>

                <div class="divider my-6">
                    또는
                </div>

                <div class="grid grid-cols-2 gap-3">

                    <a href="/"
                       class="btn btn-outline">
                        메인페이지
                    </a>

                    <a href="/member/signup"
                       class="btn btn-outline border-[#0066cc] text-[#0066cc] hover:bg-[#0066cc] hover:text-white">
                        회원가입
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
