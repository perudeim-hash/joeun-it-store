<!DOCTYPE html>
<html lang="ko" data-theme="light" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원관리</title>

    <link rel="stylesheet" href="/css/common/head.css">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-[#f5f8fc] min-h-screen">

<div th:replace="~{common/head :: head}"></div>

<div class="max-w-7xl mx-auto py-12 px-4">

    <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4 mb-8">

        <div>
            <h2 class="text-4xl font-extrabold text-[#0b1f3a]">
                회원관리
            </h2>

            <p class="mt-3 text-gray-500">
                회원 정보를 확인하고 권한 및 등급을 관리할 수 있습니다.
            </p>
        </div>

        <form action="/admin/member/search"
              method="get"
              class="flex gap-2">

            <select name="type"
                    class="select select-bordered">

                <option value="nickname">
                    닉네임
                </option>

                <option value="loginId">
                    아이디
                </option>

                <option value="memberId">
                    회원번호
                </option>

            </select>

            <input type="text"
                   name="keyword"
                   placeholder="검색어 입력"
                   class="input input-bordered w-52"
                   required>

            <button class="btn bg-[#0066cc] hover:bg-[#0052a3] text-white border-none">
                검색
            </button>

        </form>

    </div>

    <div th:if="${searchError}"
         class="alert alert-error mb-6">
        <span th:text="${searchError}">
            검색 결과가 없습니다.
        </span>
    </div>

    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">

        <div class="card bg-white shadow-xl border border-gray-100">
            <div class="card-body p-5">

                <h3 class="text-xl font-bold text-[#0b1f3a] mb-3">
                    회원 현황
                </h3>

                <div class="grid grid-cols-2 gap-3">

                    <div class="bg-[#f5f8fc] rounded-xl p-4 border border-gray-100">
                        <div class="text-xs text-gray-500 mb-1">
                            전체 회원
                        </div>
                        <div class="text-2xl font-extrabold text-[#0066cc]"
                             th:text="${memberCount}">
                            0
                        </div>
                    </div>

                    <div class="bg-[#f5f8fc] rounded-xl p-4 border border-gray-100">
                        <div class="text-xs text-gray-500 mb-1">
                            관리자
                        </div>
                        <div class="text-2xl font-extrabold text-error"
                             th:text="${adminCount}">
                            0
                        </div>
                    </div>

                    <div class="bg-[#f5f8fc] rounded-xl p-4 border border-gray-100">
                        <div class="text-xs text-gray-500 mb-1">
                            일반회원
                        </div>
                        <div class="text-2xl font-extrabold text-success"
                             th:text="${memberCount - adminCount}">
                            0
                        </div>
                    </div>

                    <div class="bg-[#f5f8fc] rounded-xl p-4 border border-gray-100">
                        <div class="text-xs text-gray-500 mb-1">
                            BRONZE
                        </div>
                        <div class="text-2xl font-extrabold text-amber-700"
                             th:text="${bronzeCount}">
                            0
                        </div>
                    </div>

                    <div class="bg-[#f5f8fc] rounded-xl p-4 border border-gray-100">
                        <div class="text-xs text-gray-500 mb-1">
                            SILVER
                        </div>
                        <div class="text-2xl font-extrabold text-slate-500"
                             th:text="${silverCount}">
                            0
                        </div>
                    </div>

                    <div class="bg-[#f5f8fc] rounded-xl p-4 border border-gray-100">
                        <div class="text-xs text-gray-500 mb-1">
                            GOLD
                        </div>
                        <div class="text-2xl font-extrabold text-yellow-500"
                             th:text="${goldCount}">
                            0
                        </div>
                    </div>

                    <div class="bg-[#f5f8fc] rounded-xl p-4 border border-gray-100 col-span-2">
                        <div class="text-xs text-gray-500 mb-1">
                            VIP
                        </div>
                        <div class="text-2xl font-extrabold text-purple-600"
                             th:text="${vipCount}">
                            0
                        </div>
                    </div>

                </div>

            </div>
        </div>

        <div class="card bg-white shadow-xl border border-gray-100 lg:col-span-2">
            <div class="card-body p-5">

                <div class="mb-3">
                    <h3 class="text-xl font-bold text-[#0b1f3a]">
                        멤버십 인원 분포
                    </h3>
                    <p class="text-sm text-gray-500 mt-1">
                        등급별 회원 수를 막대그래프로 확인합니다.
                    </p>
                </div>

                <div style="height: 230px;">
                    <canvas id="membershipChart"></canvas>
                </div>

            </div>
        </div>

    </div>

    <div class="card bg-white shadow-xl border border-gray-100">
        <div class="card-body">

            <div class="overflow-x-auto">

                <table class="table table-zebra">

                    <thead>
                    <tr>
                        <th>번호</th>
                        <th>아이디</th>
                        <th>닉네임</th>
                        <th>이메일</th>
                        <th>권한</th>
                        <th>등급</th>
                        <th>할인율</th>
                        <th>상세보기</th>
                        <th>저장</th>
                    </tr>
                    </thead>

                    <tbody>
                    <tr th:each="member : ${memberList}">

                        <form action="/admin/member/update-role" method="post">

                            <input type="hidden"
                                   name="memberId"
                                   th:value="${member.memberId}">

                            <td th:text="${member.memberId}">
                                1
                            </td>

                            <td>
                                <span class="font-semibold"
                                      th:text="${member.loginId}">
                                    user01
                                </span>
                            </td>

                            <td th:text="${member.nickname}">
                                닉네임
                            </td>

                            <td th:text="${member.email}">
                                email@test.com
                            </td>

                            <td>
                                <select name="role"
                                        class="select select-bordered select-sm role-select">
                                    <option value="USER"
                                            th:selected="${member.role == 'USER'}">
                                        USER
                                    </option>

                                    <option value="ADMIN"
                                            th:selected="${member.role == 'ADMIN'}">
                                        ADMIN
                                    </option>
                                </select>
                            </td>

                            <td>
                                <select name="membership"
                                        class="select select-bordered select-sm membership-select">

                                    <option value="BRONZE"
                                            th:selected="${member.membership == 'BRONZE'}">
                                        BRONZE
                                    </option>

                                    <option value="SILVER"
                                            th:selected="${member.membership == 'SILVER'}">
                                        SILVER
                                    </option>

                                    <option value="GOLD"
                                            th:selected="${member.membership == 'GOLD'}">
                                        GOLD
                                    </option>

                                    <option value="VIP"
                                            th:selected="${member.membership == 'VIP'}">
                                        VIP
                                    </option>

                                    <option value="ADMIN"
                                            th:selected="${member.membership == 'ADMIN'}">
                                        ADMIN
                                    </option>
                                </select>
                            </td>
                            <td>
    <span th:if="${member.membership == 'VIP'}"
          class="font-bold text-purple-600">
        10%
    </span>

                                <span th:if="${member.membership == 'GOLD'}"
                                      class="font-bold text-yellow-500">
        5%
    </span>

                                <span th:if="${member.membership == 'SILVER'}"
                                      class="font-bold text-slate-500">
        3%
    </span>

                                <span th:if="${member.membership == 'BRONZE'}"
                                      class="font-bold text-amber-700">
        1%
    </span>

                                <span th:if="${member.membership == 'ADMIN'}">
        -
    </span>
                            </td>


                            <td>
                                <a th:href="@{/admin/member/view(memberId=${member.memberId})}"
                                   class="btn btn-outline btn-sm">
                                    보기
                                </a>
                            </td>

                            <td>
                                <button type="submit"
                                        class="btn btn-sm bg-[#0066cc] hover:bg-[#0052a3] text-white border-none">
                                    저장
                                </button>
                            </td>

                        </form>

                    </tr>
                    </tbody>

                </table>

                <div class="flex justify-center mt-6">

                    <div class="join">

                        <a th:href="@{/admin/member/list(page=1)}"
                           class="join-item btn">
                            처음
                        </a>

                        <a th:if="${startPage > 1}"
                           th:href="@{/admin/member/list(page=${prevBlockPage})}"
                           class="join-item btn">
                            이전
                        </a>

                        <a th:each="i : ${#numbers.sequence(startPage, endPage)}"
                           th:href="@{/admin/member/list(page=${i})}"
                           th:text="${i}"
                           th:classappend="${i == page} ? ' btn-active' : ''"
                           class="join-item btn">
                            1
                        </a>

                        <a th:if="${endPage < totalPage}"
                           th:href="@{/admin/member/list(page=${nextBlockPage})}"
                           class="join-item btn">
                            다음
                        </a>

                        <a th:href="@{/admin/member/list(page=${totalPage})}"
                           class="join-item btn">
                            마지막
                        </a>

                    </div>

                </div>

            </div>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
    const roleSelectList = document.querySelectorAll(".role-select");

    roleSelectList.forEach(function (roleSelect) {
        const tr = roleSelect.closest("tr");
        const membershipSelect = tr.querySelector(".membership-select");

        function handleRoleChange() {
            if (roleSelect.value === "ADMIN") {
                membershipSelect.value = "ADMIN";
                membershipSelect.disabled = true;
            } else {
                membershipSelect.disabled = false;

                if (membershipSelect.value === "ADMIN") {
                    membershipSelect.value = "BRONZE";
                }
            }
        }

        handleRoleChange();
        roleSelect.addEventListener("change", handleRoleChange);
    });
</script>

<script th:inline="javascript">
    const bronzeCount = [[${bronzeCount}]];
    const silverCount = [[${silverCount}]];
    const goldCount = [[${goldCount}]];
    const vipCount = [[${vipCount}]];

    const ctx = document.getElementById("membershipChart");

    new Chart(ctx, {
        type: "bar",
        data: {
            labels: [
                "BRONZE",
                "SILVER",
                "GOLD",
                "VIP"
            ],
            datasets: [{
                label: "회원 수",
                data: [
                    bronzeCount,
                    silverCount,
                    goldCount,
                    vipCount
                ]
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    display: false
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    ticks: {
                        precision: 0
                    }
                }
            }
        }
    });
</script>

</body>
</html>
