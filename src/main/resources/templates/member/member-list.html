<!DOCTYPE html>
<html lang="ko"
      data-theme="light"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>회원관리</title>

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-base-200 min-h-screen">

<div class="navbar bg-base-100 shadow px-6">

    <div class="flex-1">
        <span class="text-xl font-bold">
            회원관리
        </span>
    </div>

    <div>
        <a href="/" class="btn btn-outline">
            메인페이지
        </a>
    </div>

</div>

<div class="max-w-7xl mx-auto py-10 px-4">

    <div class="card bg-base-100 shadow-2xl">

        <div class="card-body">

            <h2 class="text-3xl font-bold mb-2">
                회원 목록
            </h2>

            <p class="text-sm opacity-70 mb-5">
                회원 정보를 확인하고 권한 및 등급을 수정할 수 있습니다.
            </p>

            <!-- 통계 -->

            <div class="stats shadow w-full mb-6">

                <div class="stat">

                    <div class="stat-title">
                        전체 회원
                    </div>

                    <div class="stat-value text-primary"
                         th:text="${memberCount}">
                        0
                    </div>

                </div>

                <div class="stat">

                    <div class="stat-title">
                        관리자
                    </div>

                    <div class="stat-value text-error"
                         th:text="${adminCount}">
                        0
                    </div>

                </div>

                <div class="stat">

                    <div class="stat-title">
                        일반회원
                    </div>

                    <div class="stat-value text-success"
                         th:text="${memberCount - adminCount}">
                        0
                    </div>

                </div>

            </div>

            <div class="overflow-x-auto">

                <table class="table table-zebra">

                    <thead>
                    <tr>
                        <th>번호</th>
                        <th>아이디</th>
                        <th>닉네임</th>
                        <th>이메일</th>
                        <th>권한</th>
                        <th>등급</th>
                        <th>상세보기</th>
                        <th>저장</th>
                    </tr>
                    </thead>

                    <tbody>

                    <tr th:each="member : ${memberList}">

                        <form action="/admin/member/update-role"
                              method="post">

                            <input type="hidden"
                                   name="memberId"
                                   th:value="${member.memberId}">

                            <td th:text="${member.memberId}">
                                1
                            </td>

                            <td>
                                <span class="font-semibold"
                                      th:text="${member.loginId}">
                                    user01
                                </span>
                            </td>

                            <td th:text="${member.nickname}">
                                닉네임
                            </td>

                            <td th:text="${member.email}">
                                email@test.com
                            </td>

                            <td>
                                <select name="role"
                                        class="select select-bordered select-sm role-select">

                                    <option value="USER"
                                            th:selected="${member.role == 'USER'}">
                                        USER
                                    </option>

                                    <option value="ADMIN"
                                            th:selected="${member.role == 'ADMIN'}">
                                        ADMIN
                                    </option>

                                </select>
                            </td>

                            <td>
                                <select name="membership"
                                        class="select select-bordered select-sm membership-select">

                                    <option value="BRONZE"
                                            th:selected="${member.membership == 'BRONZE'}">
                                        BRONZE
                                    </option>

                                    <option value="SILVER"
                                            th:selected="${member.membership == 'SILVER'}">
                                        SILVER
                                    </option>

                                    <option value="GOLD"
                                            th:selected="${member.membership == 'GOLD'}">
                                        GOLD
                                    </option>

                                    <option value="VIP"
                                            th:selected="${member.membership == 'VIP'}">
                                        VIP
                                    </option>

                                    <option value="ADMIN"
                                            th:selected="${member.membership == 'ADMIN'}">
                                        ADMIN
                                    </option>

                                </select>
                            </td>

                            <td>

                                <a th:href="@{/admin/member/view(memberId=${member.memberId})}"
                                   class="btn btn-outline btn-sm">

                                    보기

                                </a>

                            </td>

                            <td>

                                <button type="submit"
                                        class="btn btn-primary btn-sm">

                                    저장

                                </button>

                            </td>

                        </form>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<script>

    const roleSelectList =
        document.querySelectorAll(".role-select");

    roleSelectList.forEach(function (roleSelect) {

        const tr =
            roleSelect.closest("tr");

        const membershipSelect =
            tr.querySelector(".membership-select");

        function handleRoleChange() {

            if (roleSelect.value === "ADMIN") {

                membershipSelect.value = "ADMIN";

                membershipSelect.disabled = true;

            } else {

                membershipSelect.disabled = false;

                if (membershipSelect.value === "ADMIN") {

                    membershipSelect.value = "BRONZE";

                }
            }
        }

        handleRoleChange();

        roleSelect.addEventListener(
            "change",
            handleRoleChange
        );

    });

</script>

</body>
</html>
