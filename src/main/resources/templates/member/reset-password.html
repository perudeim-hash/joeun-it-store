<!DOCTYPE html>
<html lang="ko"
      data-theme="light"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>비밀번호 변경</title>

    <link rel="stylesheet" href="/css/common/head.css">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-[#f5f8fc] min-h-screen">

<div th:replace="~{common/head :: head}"></div>

<div class="flex justify-center py-16 px-4">

    <div class="w-full max-w-md">

        <div class="text-center mb-8">
            <h2 class="text-4xl font-extrabold text-[#0b1f3a]">
                비밀번호 변경
            </h2>

            <p class="mt-3 text-gray-500">
                새로 사용할 비밀번호를 입력해주세요.
            </p>
        </div>

        <div class="card bg-white shadow-xl border border-gray-100">
            <div class="card-body p-8">

                <form action="/member/reset-password"
                      method="post">

                    <input type="hidden"
                           name="memberId"
                           th:value="${memberId}">

                    <div class="form-control mb-5">
                        <label class="label">
                            <span class="label-text font-semibold">
                                새 비밀번호
                            </span>
                        </label>

                        <input type="password"
                               id="password"
                               name="password"
                               placeholder="새 비밀번호를 입력하세요"
                               class="input input-bordered w-full focus:outline-none focus:border-[#0066cc]"
                               required>
                    </div>

                    <div class="form-control mb-6">
                        <label class="label">
                            <span class="label-text font-semibold">
                                새 비밀번호 확인
                            </span>
                        </label>

                        <input type="password"
                               id="passwordConfirm"
                               placeholder="새 비밀번호를 다시 입력하세요"
                               class="input input-bordered w-full focus:outline-none focus:border-[#0066cc]"
                               required>

                        <p id="password-message"
                           class="text-sm mt-2"></p>
                    </div>

                    <button type="submit"
                            id="btn-submit"
                            class="btn w-full bg-[#0066cc] hover:bg-[#0052a3] text-white border-none">
                        비밀번호 변경
                    </button>

                </form>

                <div class="divider my-6">
                    MENU
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <a href="/member/login"
                       class="btn btn-outline">
                        로그인
                    </a>

                    <a href="/"
                       class="btn btn-outline border-[#0066cc] text-[#0066cc] hover:bg-[#0066cc] hover:text-white">
                        메인페이지
                    </a>
                </div>

            </div>
        </div>

    </div>

</div>

<script>
    const password = document.querySelector("#password");
    const passwordConfirm = document.querySelector("#passwordConfirm");
    const passwordMessage = document.querySelector("#password-message");
    const btnSubmit = document.querySelector("#btn-submit");

    passwordConfirm.addEventListener("keyup", function () {
        if (password.value === passwordConfirm.value) {
            passwordMessage.innerText = "비밀번호가 일치합니다.";
            passwordMessage.className = "text-sm mt-2 text-success";
            btnSubmit.disabled = false;
        } else {
            passwordMessage.innerText = "비밀번호가 일치하지 않습니다.";
            passwordMessage.className = "text-sm mt-2 text-error";
            btnSubmit.disabled = true;
        }
    });
</script>

</body>
</html>
