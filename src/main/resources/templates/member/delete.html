<!DOCTYPE html>
<html lang="ko" data-theme="light" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원탈퇴</title>

    <link rel="stylesheet" href="/css/common/head.css">
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-[#f5f8fc] min-h-screen">

<div th:replace="~{common/head :: head}"></div>

<div class="flex justify-center py-16 px-4">

    <div class="w-full max-w-md">

        <div class="text-center mb-8">
            <h2 class="text-4xl font-extrabold text-error">
                회원탈퇴
            </h2>
            <p class="mt-3 text-gray-500">
                탈퇴 후 계정 정보는 복구하기 어렵습니다.
            </p>
        </div>

        <div class="card bg-white shadow-xl border border-red-100">
            <div class="card-body p-8">

                <div class="alert alert-warning mb-6">
                    <span>정말 탈퇴하시겠습니까?</span>
                </div>

                <form action="/member/delete" method="post">

                    <div class="form-control mb-6">
                        <label class="label">
                            <span class="label-text font-semibold">현재 비밀번호</span>
                        </label>
                        <input type="password"
                               name="password"
                               placeholder="비밀번호를 입력하세요"
                               class="input input-bordered w-full"
                               required>
                    </div>

                    <button class="btn btn-error w-full">
                        회원탈퇴
                    </button>

                </form>

                <div class="divider my-6">MENU</div>

                <div class="grid grid-cols-2 gap-3">
                    <a href="/member/mypage" class="btn btn-outline">
                        마이페이지
                    </a>

                    <a href="/" class="btn btn-outline">
                        메인페이지
                    </a>
                </div>

            </div>
        </div>

    </div>

</div>

</body>
</html>
