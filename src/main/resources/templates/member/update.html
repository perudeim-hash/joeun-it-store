<!DOCTYPE html>
<html lang="ko" data-theme="light" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원정보 수정</title>

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-base-200 min-h-screen flex items-center justify-center py-5">

<div class="card bg-base-100 w-full max-w-lg shadow-2xl">
    <div class="card-body">

        <h2 class="text-3xl font-bold text-center mb-5">
            회원정보 수정
        </h2>

        <form action="/member/update" method="post">

            <div class="form-control mb-3">
                <label class="label">아이디</label>
                <input type="text"
                       class="input input-bordered w-full"
                       th:value="${memberDto.loginId}"
                       readonly>
            </div>

            <div class="form-control mb-3">
                <label class="label">닉네임</label>
                <input type="text"
                       name="nickname"
                       class="input input-bordered w-full"
                       th:value="${memberDto.nickname}">
            </div>

            <div class="form-control mb-3">
                <label class="label">이메일</label>
                <input type="email"
                       name="email"
                       class="input input-bordered w-full"
                       th:value="${memberDto.email}">
            </div>

            <div class="form-control mb-3">
                <label class="label">전화번호</label>
                <input type="text"
                       name="phone"
                       class="input input-bordered w-full"
                       th:value="${memberDto.phone}">
            </div>

            <div class="form-control mb-3">
                <label class="label">우편번호</label>
                <div class="flex gap-2">
                    <input type="text"
                           id="zipcode"
                           name="zipcode"
                           class="input input-bordered flex-1"
                           th:value="${memberDto.zipcode}">
                    <button type="button"
                            onclick="searchPostcode()"
                            class="btn btn-outline w-28">
                        검색
                    </button>
                </div>
            </div>

            <div class="form-control mb-3">
                <label class="label">주소</label>
                <input type="text"
                       id="address"
                       name="address"
                       class="input input-bordered w-full"
                       th:value="${memberDto.address}">
            </div>

            <div class="form-control mb-5">
                <label class="label">상세주소</label>
                <input type="text"
                       id="detailAddress"
                       name="detailAddress"
                       class="input input-bordered w-full"
                       th:value="${memberDto.detailAddress}">
            </div>

            <button class="btn btn-primary w-full">
                수정하기
            </button>

        </form>

        <div class="divider">MENU</div>

        <div class="flex gap-2">
            <a href="/member/mypage" class="btn btn-outline flex-1">
                마이페이지
            </a>

            <a href="/" class="btn btn-ghost flex-1">
                메인페이지
            </a>
        </div>

    </div>
</div>

<script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>

<script>
    function searchPostcode() {
        new daum.Postcode({
            oncomplete: function (data) {
                document.querySelector("#zipcode").value = data.zonecode;
                document.querySelector("#address").value = data.address;
                document.querySelector("#detailAddress").focus();
            }
        }).open();
    }
</script>

</body>
</html>
