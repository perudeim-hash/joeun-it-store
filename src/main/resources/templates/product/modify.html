<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      data-theme="light">

<head>
    <meta charset="UTF-8">
    <title>상품수정</title>

    <!DOCTYPE html>

    <html lang="ko"
          xmlns:th="http://www.thymeleaf.org"
          data-theme="light">

    <head>
        <meta charset="UTF-8">
        <title>상품수정</title>


        <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet"/>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

        <link rel="stylesheet" href="/css/common/head.css">


    </head>

    <body class="bg-base-200">

    <div th:replace="~{common/head :: head}"></div>

    <div class="container mx-auto p-10">

        <h1 class="text-4xl font-bold mb-2">
            상품수정
        </h1>

        <p class="text-base-content/60 mb-8">
            상품 정보를 수정합니다.
        </p>

        <form action="/product/modify"
              method="post"
              enctype="multipart/form-data">

            <input type="hidden"
                   name="productId"
                   th:value="${product.productId}">

            <input type="hidden"
                   name="imageName"
                   th:value="${product.imageName}">

            <input type="hidden"
                   name="imagePath"
                   th:value="${product.imagePath}">

            <div class="card bg-base-100 shadow-xl">

                <div class="card-body">

                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

                        <!-- 상품정보 -->

                        <div class="lg:col-span-2">

                            <div class="grid grid-cols-2 gap-4">

                                <div>
                                    <label class="label">
                                        <span class="label-text">카테고리</span>
                                    </label>

                                    <select name="categoryId"
                                            class="select select-bordered w-full">

                                        <option value="1"
                                                th:selected="${product.categoryId == 1}">
                                            스마트폰
                                        </option>

                                        <option value="2"
                                                th:selected="${product.categoryId == 2}">
                                            노트북
                                        </option>

                                        <option value="3"
                                                th:selected="${product.categoryId == 3}">
                                            태블릿
                                        </option>

                                        <option value="4"
                                                th:selected="${product.categoryId == 4}">
                                            기타기기
                                        </option>

                                    </select>
                                </div>

                                <div>
                                    <label class="label">
                                        <span class="label-text">상품명</span>
                                    </label>

                                    <input type="text"
                                           name="productName"
                                           th:value="${product.productName}"
                                           class="input input-bordered w-full">
                                </div>

                                <div>
                                    <label class="label">
                                        <span class="label-text">브랜드</span>
                                    </label>

                                    <input type="text"
                                           name="brand"
                                           th:value="${product.brand}"
                                           class="input input-bordered w-full">
                                </div>

                                <div>
                                    <label class="label">
                                        <span class="label-text">모델명</span>
                                    </label>

                                    <input type="text"
                                           name="modelName"
                                           th:value="${product.modelName}"
                                           class="input input-bordered w-full">
                                </div>

                                <div>
                                    <label class="label">
                                        <span class="label-text">가격</span>
                                    </label>

                                    <input type="number"
                                           name="price"
                                           th:value="${product.price}"
                                           placeholder="가격"
                                           min="0"
                                           required
                                           class="input input-bordered w-full">
                                </div>

                                <div>
                                    <label class="label">
                                        <span class="label-text">재고</span>
                                    </label>

                                    <input type="number"
                                           name="stock"
                                           th:value="${product.stock}"
                                           placeholder="재고"
                                           min="0"
                                           required
                                           class="input input-bordered w-full">
                                </div>

                                <div>
                                    <label class="label">
                                        <span class="label-text">CPU</span>
                                    </label>

                                    <input type="text"
                                           name="cpu"
                                           th:value="${product.cpu}"
                                           class="input input-bordered w-full">
                                </div>

                                <div>
                                    <label class="label">
                                        <span class="label-text">RAM</span>
                                    </label>

                                    <input type="text"
                                           name="ram"
                                           th:value="${product.ram}"
                                           class="input input-bordered w-full">
                                </div>

                                <div>
                                    <label class="label">
                                        <span class="label-text">저장공간</span>
                                    </label>

                                    <input type="text"
                                           name="storageCapacity"
                                           th:value="${product.storageCapacity}"
                                           class="input input-bordered w-full">
                                </div>

                                <div>
                                    <label class="label">
                                        <span class="label-text">화면크기</span>
                                    </label>

                                    <input type="text"
                                           name="screenSize"
                                           th:value="${product.screenSize}"
                                           class="input input-bordered w-full">
                                </div>

                                <div>
                                    <label class="label">
                                        <span class="label-text">운영체제</span>
                                    </label>

                                    <input type="text"
                                           name="os"
                                           th:value="${product.os}"
                                           class="input input-bordered w-full">
                                </div>

                                <div>
                                    <label class="label">
                                        <span class="label-text">색상</span>
                                    </label>

                                    <input type="text"
                                           name="color"
                                           th:value="${product.color}"
                                           class="input input-bordered w-full">
                                </div>

                            </div>

                            <div class="mt-6">

                                <label class="label">
                            <span class="label-text">
                                상품설명
                            </span>
                                </label>

                                <textarea name="description"
                                          class="textarea textarea-bordered w-full h-40"
                                          th:text="${product.description}">
                        </textarea>

                            </div>

                            <div class="divider"></div>

                            <div>

                                <label class="label">
                            <span class="label-text font-semibold">
                                상품 이미지 변경
                            </span>
                                </label>

                                <input type="file"
                                       id="imageFile"
                                       name="upload"
                                       accept="image/*"
                                       class="file-input file-input-bordered w-full">

                            </div>

                        </div>

                        <!-- 이미지 영역 -->

                        <div>

                            <div class="card bg-base-200 shadow-md mb-4">

                                <div class="card-body items-center">

                                    <h3 class="font-bold">
                                        기존 이미지
                                    </h3>

                                    <img th:src="@{/uploads/{img}(img=${product.imageName})}"
                                         class="w-48 h-48 object-cover rounded-xl border shadow">

                                </div>

                            </div>

                            <div class="card bg-base-200 shadow-md">

                                <div class="card-body items-center">

                                    <h3 class="font-bold">
                                        수정 이미지
                                    </h3>

                                    <img id="preview"
                                         th:src="@{/uploads/{img}(img=${product.imageName})}"
                                         class="w-48 h-48 object-cover rounded-xl border shadow">

                                    <p class="text-xs text-gray-500">
                                        새 이미지를 선택하면 미리보기가 변경됩니다.
                                    </p>

                                </div>

                            </div>

                        </div>

                    </div>

                    <div class="divider"></div>

                    <div class="flex justify-end gap-2 mt-4">

                        <button type="submit"
                                class="btn btn-success">
                            수정완료
                        </button>

                        <a href="/product/list"
                           class="btn btn-error">
                            취소
                        </a>

                    </div>

                </div>

            </div>

        </form>


    </div>

    <script src="/js/product/modify.js"></script>

    </body>
    </html>
