<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      data-theme="light">

<head>
    <meta charset="UTF-8">
    <title>상품수정</title>

    <!DOCTYPE html>

    <html lang="ko"
          xmlns:th="http://www.thymeleaf.org"
          data-theme="light">

    <head>
        <meta charset="UTF-8">
        <title>상품수정</title>


        <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet"/>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

        <link rel="stylesheet" href="/css/common/head.css">

    </head>

    <body class="bg-base-200">

    <div th:replace="~{common/head :: head}"></div>

    <div class="container mx-auto p-10">
        
        <h1 class="text-4xl font-bold mb-2">
            상품수정
        </h1>

        <p class="text-base-content/60 mb-8">
            상품 정보를 수정합니다.
        </p>

        <form action="/product/modify"
              method="post"
              enctype="multipart/form-data">

            <input type="hidden"
                   name="productId"
                   th:value="${product.productId}">

            <input type="hidden"
                   name="imageName"
                   th:value="${product.imageName}">

            <input type="hidden"
                   name="imagePath"
                   th:value="${product.imagePath}">

            <div class="card bg-base-100 shadow-xl">

                <div class="card-body">

                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">

                        <!-- 상품정보 -->

                        <div class="lg:col-span-2">

                            <div class="grid grid-cols-2 gap-4">

                                <div>
                                    <label class="label">
                                        <span class="label-text">카테고리</span>
                                    </label>

                                    <select name="categoryId"
                                            class="select select-bordered w-full">

                                        <option value="1"
                                                th:selected="${product.categoryId == 1}">
                                            스마트폰
                                        </option>

                                        <option value="2"
                                                th:selected="${product.categoryId == 2}">
                                            노트북
                                        </option>

                                        <option value="3"
                                                th:selected="${product.categoryId == 3}">
                                            태블릿
                                        </option>

                                        <option value="4"
                                                th:selected="${product.categoryId == 4}">
                                            기타기기
                                        </option>

                                    </select>
                                </div>

                                <div>
                                    <label class="label">
                                        <span class="label-text">상품명</span>
                                    </label>

                                    <input type="text"
                                           name="productName"
                                           th:value="${product.productName}"
                                           class="input input-bordered w-full">
                                </div>

                                <div>
                                    <label class="label">
                                        <span class="label-text">브랜드</span>
                                    </label>

                                    <select id="brandSelect"
                                            class="select select-bordered w-full">

                                        <option value="Samsung">Samsung</option>
                                        <option value="Apple">Apple</option>
                                        <option value="LG">LG</option>
                                        <option value="ASUS">ASUS</option>
                                        <option value="Lenovo">Lenovo</option>
                                        <option value="MSI">MSI</option>
                                        <option value="직접입력">직접입력</option>

                                    </select>

                                    <input type="text"
                                           id="brandInput"
                                           name="brand"
                                           th:value="${product.brand}"
                                           class="input input-bordered w-full mt-2 hidden">
                                </div>

                                <div>
                                    <label class="label">
                                        <span class="label-text">모델명</span>
                                    </label>

                                    <input type="text"
                                           name="modelName"
                                           th:value="${product.modelName}"
                                           class="input input-bordered w-full">
                                </div>

                                <div>
                                    <label class="label">
                                        <span class="label-text">가격</span>
                                    </label>

                                    <input type="number"
                                           name="price"
                                           th:value="${product.price}"
                                           class="input input-bordered w-full">
                                </div>

                                <div>
                                    <label class="label">
                                        <span class="label-text">재고</span>
                                    </label>

                                    <input type="number"
                                           name="stock"
                                           th:value="${product.stock}"
                                           class="input input-bordered input-primary w-full">
                                </div>

                                <div>
                                    <label class="label">
                                        <span class="label-text">CPU</span>
                                    </label>

                                    <select id="cpuSelect"
                                            class="select select-bordered w-full">

                                        <option value="">선택</option>
                                        <option value="Intel i3">Intel i3</option>
                                        <option value="Intel i5">Intel i5</option>
                                        <option value="Intel i7">Intel i7</option>
                                        <option value="Intel i9">Intel i9</option>
                                        <option value="AMD Ryzen 5">AMD Ryzen 5</option>
                                        <option value="AMD Ryzen 7">AMD Ryzen 7</option>
                                        <option value="AMD Ryzen 9">AMD Ryzen 9</option>
                                        <option value="Apple M1">Apple M1</option>
                                        <option value="Apple M2">Apple M2</option>
                                        <option value="Apple M3">Apple M3</option>
                                        <option value="직접입력">직접입력</option>

                                    </select>

                                    <input type="text"
                                           id="cpu"
                                           name="cpu"
                                           th:value="${product.cpu}"
                                           class="input input-bordered w-full mt-2 hidden"
                                           placeholder="CPU 입력">
                                </div>

                                <div>
                                    <label class="label">
                                        <span class="label-text">RAM</span>
                                    </label>

                                    <select id="ramSelect"
                                            class="select select-bordered w-full">

                                        <option value="">선택</option>
                                        <option value="4GB">4GB</option>
                                        <option value="8GB">8GB</option>
                                        <option value="12GB">12GB</option>
                                        <option value="16GB">16GB</option>
                                        <option value="24GB">24GB</option>
                                        <option value="32GB">32GB</option>
                                        <option value="64GB">64GB</option>
                                        <option value="직접입력">직접입력</option>

                                    </select>

                                    <input type="text"
                                           id="ram"
                                           name="ram"
                                           th:value="${product.ram}"
                                           class="input input-bordered w-full mt-2 hidden"
                                           placeholder="RAM 입력">

                                </div>

                                <div>
                                    <label class="label">
                                        <span class="label-text">저장공간</span>
                                    </label>

                                    <select id="storageSelect"
                                            class="select select-bordered w-full">

                                        <option value="">선택</option>
                                        <option value="128GB">128GB</option>
                                        <option value="256GB">256GB</option>
                                        <option value="512GB">512GB</option>
                                        <option value="1TB">1TB</option>
                                        <option value="2TB">2TB</option>
                                        <option value="직접입력">직접입력</option>

                                    </select>

                                    <input type="text"
                                           id="storageCapacity"
                                           name="storageCapacity"
                                           th:value="${product.storageCapacity}"
                                           class="input input-bordered w-full mt-2 hidden"
                                           placeholder="저장공간 입력">

                                </div>

                                <div>
                                    <div>
                                        <label class="label">
                                            <span class="label-text">화면크기</span>
                                        </label>

                                        <select id="screenSizeSelect"
                                                class="select select-bordered w-full">

                                            <option value="">선택</option>
                                            <option value="6.1인치">6.1인치</option>
                                            <option value="6.7인치">6.7인치</option>
                                            <option value="10.9인치">10.9인치</option>
                                            <option value="11인치">11인치</option>
                                            <option value="12.9인치">12.9인치</option>
                                            <option value="13인치">13인치</option>
                                            <option value="14인치">14인치</option>
                                            <option value="15.6인치">15.6인치</option>
                                            <option value="16인치">16인치</option>
                                            <option value="직접입력">직접입력</option>

                                        </select>

                                        <input type="text"
                                               id="screenSize"
                                               name="screenSize"
                                               th:value="${product.screenSize}"
                                               class="input input-bordered w-full mt-2 hidden"
                                               placeholder="화면크기 입력">

                                    </div>
                                </div>

                                <div>
                                    <label class="label">
                                        <span class="label-text">운영체제</span>
                                    </label>

                                    <select id="osSelect"
                                            class="select select-bordered w-full">

                                        <option value="">선택</option>
                                        <option value="Windows 11">Windows 11</option>
                                        <option value="Windows 10">Windows 10</option>
                                        <option value="MacOS">MacOS</option>
                                        <option value="Android">Android</option>
                                        <option value="iOS">iOS</option>
                                        <option value="Linux">Linux</option>
                                        <option value="직접입력">직접입력</option>

                                    </select>

                                    <input type="text"
                                           id="os"
                                           name="os"
                                           th:value="${product.os}"
                                           class="input input-bordered w-full mt-2 hidden"
                                           placeholder="운영체제 입력">

                                </div>

                                <div>
                                    <label class="label">
                                        <span class="label-text">색상</span>
                                    </label>

                                    <select id="colorSelect"
                                            class="select select-bordered w-full">

                                        <option value="">선택</option>
                                        <option value="블랙">블랙</option>
                                        <option value="화이트">화이트</option>
                                        <option value="실버">실버</option>
                                        <option value="골드">골드</option>
                                        <option value="블루">블루</option>
                                        <option value="핑크">핑크</option>
                                        <option value="그린">그린</option>
                                        <option value="직접입력">직접입력</option>

                                    </select>

                                    <input type="text"
                                           id="color"
                                           name="color"
                                           th:value="${product.color}"
                                           class="input input-bordered w-full mt-2 hidden"
                                           placeholder="색상 입력">

                                </div>

                            </div>

                            <div class="mt-6">

                                <label class="label">
                            <span class="label-text">
                                상품설명
                            </span>
                                </label>

                                <textarea name="description"
                                          class="textarea textarea-bordered w-full h-40"
                                          th:text="${product.description}">
                        </textarea>

                            </div>

                            <div class="divider"></div>

                            <div>

                                <label class="label">
                            <span class="label-text font-semibold">
                                상품 이미지 변경
                            </span>
                                </label>

                                <input type="file"
                                       id="imageFile"
                                       name="upload"
                                       accept="image/*"
                                       class="file-input file-input-bordered w-full">

                            </div>

                        </div>

                        <!-- 이미지 영역 -->

                        <div>

                            <div class="card bg-base-200 shadow-md mb-4">

                                <div class="card-body items-center">

                                    <h3 class="font-bold">
                                        기존 이미지
                                    </h3>

                                    <img th:src="@{/uploads/{img}(img=${product.imageName})}"
                                         class="w-48 h-48 object-cover rounded-xl border shadow">

                                </div>

                            </div>

                            <div class="card bg-base-200 shadow-md">

                                <div class="card-body items-center">

                                    <h3 class="font-bold">
                                        수정 이미지
                                    </h3>

                                    <img id="preview"
                                         th:src="@{/uploads/{img}(img=${product.imageName})}"
                                         class="w-48 h-48 object-cover rounded-xl border shadow">

                                    <p class="text-xs text-gray-500">
                                        새 이미지를 선택하면 미리보기가 변경됩니다.
                                    </p>

                                </div>

                            </div>

                        </div>

                    </div>

                    <div class="divider"></div>

                    <div class="flex justify-end gap-2 mt-4">

                        <button type="submit"
                                class="btn btn-success">
                            수정완료
                        </button>

                        <a href="/product/list"
                           class="btn btn-error">
                            취소
                        </a>

                    </div>

                </div>

            </div>

        </form>


    </div>

    <script src="/js/product/modify.js"></script>

    </body>
    </html>
