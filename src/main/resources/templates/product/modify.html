<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>상품수정</title>

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet"/>
    <link rel="stylesheet" href="/css/common/head.css">

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-base-200">

<div th:replace="~{common/head :: head}"></div>

<div class="container mx-auto p-10">

    <form action="/product/modify" method="post" enctype="multipart/form-data">

        <input type="hidden" name="productId" th:value="${product.productId}">

        <!-- 이미지 유지 -->
        <input type="hidden" name="imageName" th:value="${product.imageName}">
        <input type="hidden" name="imagePath" th:value="${product.imagePath}">

        <!-- 수정폼에 없는 값 유지 -->
        <input type="hidden" name="categoryId" th:value="${product.categoryId}">
        <input type="hidden" name="modelName" th:value="${product.modelName}">
        <input type="hidden" name="cpu" th:value="${product.cpu}">
        <input type="hidden" name="ram" th:value="${product.ram}">
        <input type="hidden" name="storageCapacity" th:value="${product.storageCapacity}">
        <input type="hidden" name="screenSize" th:value="${product.screenSize}">
        <input type="hidden" name="os" th:value="${product.os}">
        <input type="hidden" name="color" th:value="${product.color}">

        <div class="card bg-base-100 shadow-xl">

            <div class="card-body">

                <h1 class="text-3xl font-bold">
                    상품수정
                </h1>

                <div class="flex justify-center">

                    <img th:if="${product.imageName != null}"
                         th:src="@{/uploads/{img}(img=${product.imageName})}"
                         th:alt="${product.productName}"
                         class="w-72 h-72 object-cover rounded-lg border shadow">

                    <img th:if="${product.imageName == null}"
                         src="/images/no-image.png"
                         alt="no-image"
                         class="w-72 h-72 object-cover rounded-lg border shadow">

                </div>

                <div class="flex justify-center">

                    <img id="preview"
                         src=""
                         class="hidden w-72 h-72 object-cover rounded-lg border shadow mt-3">

                </div>

                <input type="text"
                       name="productName"
                       th:value="${product.productName}"
                       class="input input-bordered">

                <input type="text"
                       name="brand"
                       th:value="${product.brand}"
                       class="input input-bordered">

                <input type="number"
                       name="price"
                       th:value="${product.price}"
                       class="input input-bordered">

                <input type="number"
                       name="stock"
                       th:value="${product.stock}"
                       class="input input-bordered">

                <textarea name="description"
                          class="textarea textarea-bordered"
                          th:text="${product.description}">
                </textarea>

                <input type="file"
                       name="upload"
                       accept="image/*"
                       class="file-input file-input-bordered"
                       onchange="previewImage(this)">

                <div class="card-actions justify-end">

                    <button type="submit"
                            class="btn btn-success">
                        수정완료
                    </button>

                    <a href="/product/list"
                       class="btn btn-neutral">
                        취소
                    </a>

                </div>

            </div>

        </div>

    </form>

</div>

<script>

    function previewImage(input) {

        const file = input.files[0];

        if (!file) return;

        const reader = new FileReader();

        reader.onload = function(e) {

            const preview = document.querySelector("#preview");

            preview.src = e.target.result;

            preview.classList.remove("hidden");

        };

        reader.readAsDataURL(file);

    }

</script>

</body>
</html>
