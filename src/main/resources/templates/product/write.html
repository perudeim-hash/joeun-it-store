<!DOCTYPE html>
<html lang="ko" data-theme="light">

<head>
    <meta charset="UTF-8">
    <title>상품등록</title>

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-base-200 min-h-screen">

<div class="container mx-auto max-w-7xl p-10">

    <div class="mb-8">

        <h1 class="text-4xl font-bold">
            상품등록
        </h1>

        <p class="text-gray-500 mt-2">
            새로운 상품 정보를 등록하세요.
        </p>

    </div>

    <form action="/product/write"
          method="post"
          enctype="multipart/form-data">

        <div class="card bg-base-100 shadow-2xl">

            <div class="card-body">

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">

                    <div class="form-control">
                        <label class="label">
                            <span class="label-text font-bold">카테고리</span>
                        </label>

                        <select id="categoryId"
                                name="categoryId"
                                class="select select-bordered w-full">

                            <option value="1">스마트폰</option>
                            <option value="2">노트북</option>
                            <option value="3">태블릿</option>
                            <option value="4">기타기기</option>

                        </select>
                    </div>

                    <div class="form-control spec-item">
                        <label class="label">
                            <span class="label-text font-bold">상품명</span>
                        </label>

                        <input type="text"
                               name="productName"
                               class="input input-bordered w-full"
                               placeholder="상품명"
                               required>
                    </div>

                    <div class="form-control">

                        <label class="label">
                            <span class="label-text font-bold">브랜드</span>
                        </label>

                        <select id="brandSelect"
                                class="select select-bordered w-full">

                            <option value="">선택</option>
                            <option value="Samsung">Samsung</option>
                            <option value="Apple">Apple</option>
                            <option value="LG">LG</option>
                            <option value="ASUS">ASUS</option>
                            <option value="Lenovo">Lenovo</option>
                            <option value="MSI">MSI</option>
                            <option value="Logitech">Logitech</option>
                            <option value="Anker">Anker</option>
                            <option value="MOFT">MOFT</option>
                            <option value="직접입력">직접입력</option>

                        </select>

                        <input type="text"
                               id="brand"
                               name="brand"
                               class="input input-bordered w-full mt-2"
                               placeholder="브랜드 입력">

                    </div>

                    <div class="form-control">
                        <label class="label">
                            <span class="label-text font-bold">모델명</span>
                        </label>

                        <input type="text"
                               name="modelName"
                               class="input input-bordered w-full"
                               placeholder="모델명">
                    </div>

                    <div class="form-control">
                        <label class="label">
                            <span class="label-text font-bold">가격</span>
                        </label>

                        <input type="number"
                               name="price"
                               class="input input-bordered w-full"
                               placeholder="가격"
                               min="0"
                               required>
                    </div>

                    <div class="form-control">
                        <label class="label">
                            <span class="label-text font-bold">재고</span>
                        </label>

                        <input type="number"
                               name="stock"
                               class="input input-bordered w-full"
                               placeholder="재고"
                               min="0"
                               required>
                    </div>

                    <div class="form-control spec-item">

                        <label class="label">
                            <span class="label-text font-bold">CPU</span>
                        </label>

                        <select id="cpuSelect"
                                class="select select-bordered w-full">

                            <option value="">선택</option>
                            <option value="Snapdragon 8 Elite">Snapdragon 8 Elite</option>
                            <option value="Apple A18 Pro">Apple A18 Pro</option>
                            <option value="Intel i3">Intel i3</option>
                            <option value="Intel i5">Intel i5</option>
                            <option value="Intel i7">Intel i7</option>
                            <option value="Intel Ultra 7">Intel Ultra 7</option>
                            <option value="AMD Ryzen 5">AMD Ryzen 5</option>
                            <option value="AMD Ryzen 7">AMD Ryzen 7</option>
                            <option value="직접입력">직접입력</option>

                        </select>

                        <input type="text"
                               id="cpu"
                               name="cpu"
                               class="input input-bordered w-full mt-2"
                               placeholder="CPU 입력">

                    </div>

                    <div class="form-control spec-item">

                        <label class="label">
                            <span class="label-text font-bold">RAM</span>
                        </label>

                        <input type="text"
                               name="ram"
                               class="input input-bordered w-full"
                               placeholder="RAM">

                    </div>
                    <div class="form-control spec-item">

                        <label class="label">
                            <span class="label-text font-bold">저장공간</span>
                        </label>

                        <select id="storageSelect"
                                class="select select-bordered w-full">

                            <option value="">선택</option>
                            <option value="64GB">64GB</option>
                            <option value="128GB">128GB</option>
                            <option value="256GB">256GB</option>
                            <option value="512GB">512GB</option>
                            <option value="1TB">1TB</option>
                            <option value="2TB">2TB</option>
                            <option value="직접입력">직접입력</option>

                        </select>

                        <input type="text"
                               id="storageCapacity"
                               name="storageCapacity"
                               class="input input-bordered w-full mt-2"
                               placeholder="저장공간 입력">

                    </div>

                    <div class="form-control spec-item">
                        <label class="label">
                            <span class="label-text font-bold">화면크기</span>
                        </label>

                        <input type="text"
                               name="screenSize"
                               class="input input-bordered w-full"
                               placeholder="화면크기">
                    </div>

                    <div class="form-control spec-item">

                        <label class="label">
                            <span class="label-text font-bold">운영체제</span>
                        </label>

                        <select id="osSelect"
                                class="select select-bordered w-full">

                            <option value="">선택</option>
                            <option value="Android">Android</option>
                            <option value="iOS">iOS</option>
                            <option value="Windows 11">Windows 11</option>
                            <option value="Windows 10">Windows 10</option>
                            <option value="MacOS">MacOS</option>
                            <option value="Linux">Linux</option>
                            <option value="직접입력">직접입력</option>

                        </select>

                        <input type="text"
                               id="os"
                               name="os"
                               class="input input-bordered w-full mt-2"
                               placeholder="운영체제 입력">

                    </div>
                    <div class="form-control">

                        <label class="label">
                            <span class="label-text font-bold">색상</span>
                        </label>

                        <select id="colorSelect"
                                class="select select-bordered w-full">

                            <option value="">선택</option>
                            <option value="블랙">블랙</option>
                            <option value="화이트">화이트</option>
                            <option value="실버">실버</option>
                            <option value="골드">골드</option>
                            <option value="블루">블루</option>
                            <option value="그린">그린</option>
                            <option value="퍼플">퍼플</option>
                            <option value="핑크">핑크</option>
                            <option value="직접입력">직접입력</option>

                        </select>

                        <input type="text"
                               id="color"
                               name="color"
                               class="input input-bordered w-full mt-2"
                               placeholder="색상 입력">

                    </div>

                </div>

                <div class="divider"></div>

                <div class="form-control">

                    <label class="label">
                        <span class="label-text font-bold">
                            상품설명
                        </span>
                    </label>

                    <textarea
                            name="description"
                            rows="6"
                            class="textarea textarea-bordered w-full"
                            placeholder="상품설명">
                    </textarea>

                </div>

                <div class="divider"></div>

                <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">

                    <div>

                        <label class="label">
                            <span class="label-text font-bold">
                                상품 이미지
                            </span>
                        </label>

                        <input type="file"
                               id="imageFile"
                               name="upload"
                               accept="image/*"
                               class="file-input file-input-bordered w-full">

                    </div>

                    <div class="flex justify-center items-center">

                        <img id="preview"
                             src=""
                             class="hidden w-80 h-80 object-contain rounded-xl border bg-white shadow">

                    </div>

                </div>

                <div class="divider"></div>

                <div class="flex gap-3">

                    <button type="submit"
                            class="btn btn-primary btn-lg flex-1">

                        상품 등록

                    </button>

                    <a href="/product/list"
                       class="btn btn-neutral btn-lg">

                        목록

                    </a>

                </div>

            </div>

        </div>

    </form>

</div>

<script src="/js/product/write.js"></script>

</body>
</html>
