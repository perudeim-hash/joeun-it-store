<!DOCTYPE html>
<html lang="ko" data-theme="light">

<head>
    <meta charset="UTF-8">
    <title>상품등록</title>

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet"/>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-base-200">

<div class="container mx-auto p-10">

    <h1 class="text-4xl font-bold mb-10">
        상품등록
    </h1>

    <form action="/product/write"
          method="post"
          enctype="multipart/form-data">

        <div class="card bg-base-100 shadow-xl">

            <div class="card-body space-y-4">

                <select name="categoryId"
                        class="select select-bordered">

                    <option value="1">스마트폰</option>
                    <option value="2">노트북</option>
                    <option value="3">태블릿</option>
                    <option value="4">기타기기</option>

                </select>

                <input type="text"
                       name="productName"
                       placeholder="상품명"
                       class="input input-bordered"
                       required/>

                <input type="text"
                       name="brand"
                       placeholder="브랜드"
                       class="input input-bordered"/>

                <input type="text"
                       name="modelName"
                       placeholder="모델명"
                       class="input input-bordered"/>

                <input type="number"
                       name="price"
                       placeholder="가격"
                       class="input input-bordered"
                       required/>

                <input type="number"
                       name="stock"
                       placeholder="재고"
                       class="input input-bordered"
                       required/>

                <input type="text"
                       name="cpu"
                       placeholder="CPU"
                       class="input input-bordered"/>

                <input type="text"
                       name="ram"
                       placeholder="RAM"
                       class="input input-bordered"/>

                <input type="text"
                       name="storageCapacity"
                       placeholder="저장공간"
                       class="input input-bordered"/>

                <input type="text"
                       name="screenSize"
                       placeholder="화면크기"
                       class="input input-bordered"/>

                <input type="text"
                       name="os"
                       placeholder="운영체제"
                       class="input input-bordered"/>

                <input type="text"
                       name="color"
                       placeholder="색상"
                       class="input input-bordered"/>

                <textarea name="description"
                          class="textarea textarea-bordered"
                          placeholder="상품설명"></textarea>

                <div>

                    <label class="label">
                        <span class="label-text font-semibold">
                            상품 이미지
                        </span>
                    </label>

                    <input type="file"
                           name="upload"
                           accept="image/*"
                           class="file-input file-input-bordered w-full"
                           onchange="previewImage(this)"/>

                </div>

                <div class="flex justify-center">

                    <img id="preview"
                         src=""
                         class="hidden w-72 h-72 object-cover rounded-lg border shadow">

                </div>

                <button type="submit"
                        class="btn btn-primary">

                    상품등록

                </button>

            </div>

        </div>

    </form>

</div>

<script>

    function previewImage(input){

        const file = input.files[0];

        if(!file){
            return;
        }

        const reader = new FileReader();

        reader.onload = function(e){

            const preview =
                document.querySelector("#preview");

            preview.src =
                e.target.result;

            preview.classList.remove("hidden");
        };

        reader.readAsDataURL(file);
    }

</script>

</body>
</html>
