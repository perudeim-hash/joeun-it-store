<!DOCTYPE html>
<html lang="ko" data-theme="light"><head><meta charset="UTF-8"><title>상품등록</title><link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet"/><script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script></head><body class="bg-base-200"><div class="container mx-auto p-10"><h1 class="text-4xl font-bold mb-10">상품등록</h1><form action="/product/write" method="post"><div class="card bg-base-100 shadow-xl"><div class="card-body space-y-4"><select name="categoryId" class="select select-bordered"><option value="9">스마트폰</option><option value="10">노트북</option><option value="11">태블릿</option><option value="12">기타기기</option></select><input type="text" name="productName" placeholder="상품명" class="input input-bordered"/><input type="text" name="brand" placeholder="브랜드" class="input input-bordered"/><input type="text" name="modelName" placeholder="모델명" class="input input-bordered"/><input type="number" name="price" placeholder="가격" class="input input-bordered"/><input type="number" name="stock" placeholder="재고" class="input input-bordered"/><textarea name="description" class="textarea textarea-bordered" placeholder="상품설명"></textarea><button class="btn btn-primary">상품등록</button></div></div></form></div></body></html>
