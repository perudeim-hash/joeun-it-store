<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      data-theme="light">

<head>
    <meta charset="UTF-8">
    <title>상품목록</title>

    <!-- DaisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet"/>

    <!-- 공통 헤더 CSS -->
    <link rel="stylesheet" href="/css/common/head.css">

    <!-- Tailwind -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-base-200">

<!-- 공통 헤더 -->
<div th:replace="~{common/head :: head}"></div>

<div class="max-w-[1400px] mx-auto mt-10 flex gap-8">

    <!-- ==========================================
         왼쪽 메뉴
    ========================================== -->

    <div class="w-64">

        <div class="card bg-base-100 shadow-xl">

            <div class="card-body">

                <h2 class="card-title text-2xl">
                    조은IT 쇼핑몰
                </h2>

                <div class="divider"></div>

                <a href="/product/list"
                   class="btn btn-outline btn-primary w-full">
                    상품목록
                </a>

                <a href="/product/write"
                   class="btn btn-outline btn-success w-full">
                    상품등록
                </a>

            </div>

        </div>

    </div>

    <!-- ==========================================
         오른쪽 본문
    ========================================== -->

    <div class="flex-1">

        <!-- 제목 -->

        <div class="flex justify-between items-center mb-6">

            <h1 class="text-4xl font-bold">
                상품목록
            </h1>

            <a href="/product/write"
               class="btn btn-primary">
                상품등록
            </a>

        </div>

        <!-- ==========================================
             카테고리 검색
        ========================================== -->

        <form action="/product/list"
              method="get"
              class="flex gap-3 mb-6">

            <select name="categoryId"
                    class="select select-bordered w-60">

                <option value="">
                    전체카테고리
                </option>

                <option value="1">
                    스마트폰
                </option>

                <option value="2">
                    노트북
                </option>

                <option value="3">
                    태블릿
                </option>

                <option value="4">
                    기타기기
                </option>

            </select>

            <button class="btn btn-primary">
                검색
            </button>

        </form>

        <!-- ==========================================
             상품목록
        ========================================== -->

        <div class="card bg-base-100 shadow-xl">

            <div class="card-body">

                <div class="overflow-x-auto">

                    <table class="table table-zebra">

                        <thead>

                        <tr>

                            <th>번호</th>
                            <th>상품명</th>
                            <th>브랜드</th>
                            <th>가격</th>
                            <th>재고</th>
                            <th>상태</th>
                            <th>관리</th>

                        </tr>

                        </thead>

                        <tbody>

                        <tr th:each="product : ${productList}">

                            <td th:text="${product.productId}">
                            </td>

                            <td class="font-bold"
                                th:text="${product.productName}">
                            </td>

                            <td th:text="${product.brand}">
                            </td>

                            <td>
                                <span th:text="${#numbers.formatInteger(product.price,3,'COMMA')}">
                                </span>
                                원
                            </td>

                            <td th:text="${product.stock}">
                            </td>

                            <td>

                                <div class="badge badge-success"
                                     th:text="${product.status}">
                                </div>

                            </td>

                            <td>

                                <div class="flex gap-2">

                                    <!-- 상세 -->

                                    <a th:href="@{/product/view(productId=${product.productId})}"
                                       class="btn btn-sm btn-info">

                                        상세

                                    </a>

                                    <!-- 수정 -->

                                    <a th:href="@{/product/modify(productId=${product.productId})}"
                                       class="btn btn-sm btn-success">

                                        수정

                                    </a>

                                    <!-- 삭제 -->

                                    <a th:href="@{/product/delete(productId=${product.productId})}"
                                       class="btn btn-sm btn-error"
                                       onclick="return confirm('삭제하시겠습니까?');">

                                        삭제

                                    </a>

                                </div>

                            </td>

                        </tr>

                        </tbody>

                    </table>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
