
<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      data-theme="light">

<head>
    <meta charset="UTF-8">
    <title>상품목록</title>

    <!-- DaisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet"/>

    <!-- Tailwind -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-base-200">

<div class="drawer lg:drawer-open">

    <input id="my-drawer"
           type="checkbox"
           class="drawer-toggle"/>

    <div class="drawer-content">

        <!-- ==========================================
             상단 네비게이션
        ========================================== -->

        <div class="navbar bg-base-100 shadow-lg">

            <div class="flex-1">

                <span class="text-2xl font-bold">
                    조은IT 쇼핑몰
                </span>

            </div>

            <div>

                <div class="badge badge-primary">
                    관리자
                </div>

            </div>

        </div>

        <!-- ==========================================
             본문
        ========================================== -->

        <div class="p-10">

            <!-- 제목 -->

            <div class="flex justify-between items-center mb-6">

                <h1 class="text-4xl font-bold">
                    상품목록
                </h1>

                <a href="/product/write"
                   class="btn btn-primary">

                    상품등록

                </a>

            </div>

            <!-- ==========================================
                 카테고리 검색
            ========================================== -->

            <form action="/product/list"
                  method="get"
                  class="flex gap-3 mb-6">

                <select name="categoryId"
                        class="select select-bordered w-60">

                    <option value="">
                        전체카테고리
                    </option>

                    <option value="9">
                        스마트폰
                    </option>

                    <option value="10">
                        노트북
                    </option>

                    <option value="11">
                        태블릿
                    </option>

                    <option value="12">
                        기타기기
                    </option>

                </select>

                <button class="btn btn-primary">
                    검색
                </button>

            </form>

            <!-- ==========================================
                 상품 목록
            ========================================== -->

            <div class="card bg-base-100 shadow-xl">

                <div class="card-body">

                    <div class="overflow-x-auto">

                        <table class="table table-zebra">

                            <thead>

                            <tr>

                                <th>번호</th>
                                <th>상품명</th>
                                <th>브랜드</th>
                                <th>가격</th>
                                <th>재고</th>
                                <th>상태</th>
                                <th>관리</th>

                            </tr>

                            </thead>

                            <tbody>

                            <tr th:each="product : ${productList}">

                                <td th:text="${product.productId}"></td>

                                <td class="font-bold"
                                    th:text="${product.productName}">
                                </td>

                                <td th:text="${product.brand}"></td>

                                <td>

                                    <span th:text="${#numbers.formatInteger(product.price,3,'COMMA')}">
                                    </span> 원

                                </td>

                                <td th:text="${product.stock}"></td>

                                <td>

                                    <div class="badge badge-success"
                                         th:text="${product.status}">
                                    </div>

                                </td>

                                <td>

                                    <div class="flex gap-2">

                                        <a href="#"
                                           class="btn btn-sm btn-info">

                                            상세

                                        </a>

                                        <a href="#"
                                           class="btn btn-sm btn-success">

                                            수정

                                        </a>

                                        <a href="#"
                                           class="btn btn-sm btn-error">

                                            삭제

                                        </a>

                                    </div>

                                </td>

                            </tr>

                            </tbody>

                        </table>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- ==========================================
         좌측 메뉴
    ========================================== -->

    <div class="drawer-side">

        <label for="my-drawer"
               aria-label="close sidebar"
               class="drawer-overlay">
        </label>

        <ul class="menu bg-base-100 min-h-full w-72 p-4">

            <li class="text-2xl font-bold mb-5">

                조은IT 쇼핑몰

            </li>

            <li>

                <a href="/product/list">

                    상품목록

                </a>

            </li>

            <li>

                <a href="/product/write">

                    상품등록

                </a>

            </li>

        </ul>

    </div>

</div>

</body>
</html>
```
