<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      data-theme="light">

<head>
    <meta charset="UTF-8">
    <title>상품상세</title>

    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="stylesheet" href="/css/common/head.css">
</head>

<body class="bg-base-200">

<div th:replace="~{common/head :: head}"></div>

<div class="max-w-[1200px] mx-auto mt-10">

    <div class="card bg-base-100 shadow-xl">

        <div class="card-body p-8">

            <h1 class="text-4xl font-bold mb-6">
                상품상세
            </h1>

            <div class="divider"></div>

            <div class="flex gap-10">

                <!-- 상품 정보 -->

                <div class="flex-1">

                    <div class="space-y-4 text-lg">

                        <p>
                            <strong>상품명 :</strong>
                            <span th:text="${product.productName}"></span>
                        </p>

                        <p>
                            <strong>브랜드 :</strong>
                            <span th:text="${product.brand}"></span>
                        </p>

                        <p>
                            <strong>가격 :</strong>
                            <span th:text="${#numbers.formatInteger(product.price,3,'COMMA')}"></span>
                            원
                        </p>

                        <p>
                            <strong>재고 :</strong>
                            <span th:text="${product.stock}"></span>
                        </p>

                        <p>
                            <strong>설명 :</strong>
                            <span th:text="${product.description}"></span>
                        </p>

                    </div>

                </div>

                <!-- 상품 이미지 -->

                <div class="w-[450px] flex justify-center">

                    <img th:if="${product.imageName != null}"
                         th:src="@{/uploads/{img}(img=${product.imageName})}"
                         th:alt="${product.productName}"
                         class="w-full h-[450px] object-cover rounded-xl shadow-lg border">

                    <img th:if="${product.imageName == null}"
                         src="/images/no-image.png"
                         alt="no-image"
                         class="w-full h-[450px] object-cover rounded-xl shadow-lg border">

                </div>

            </div>

            <div class="divider"></div>

            <div class="flex justify-end gap-3">

                <!-- 관리자 -->

                <th:block th:if="${loginMember != null and loginMember.role == 'ADMIN'}">

                    <a th:href="@{/product/modify(productId=${product.productId})}"
                       class="btn btn-success">
                        수정
                    </a>

                    <a th:href="@{/product/delete(productId=${product.productId})}"
                       class="btn btn-error"
                       onclick="return confirm('삭제하시겠습니까?');">
                        삭제
                    </a>

                    <a href="/product/list"
                       class="btn btn-primary">
                        목록
                    </a>

                </th:block>

                <!-- 일반회원 -->

                <th:block th:if="${loginMember != null and loginMember.role == 'USER'}">

                    <form action="/cart/add"
                          method="post">

                        <input type="hidden"
                               name="productId"
                               th:value="${product.productId}">

                        <input type="hidden"
                               name="quantity"
                               value="1">

                        <button type="submit"
                                class="btn btn-warning">

                            장바구니 담기

                        </button>

                    </form>

                    <a href="/product/list"
                       class="btn btn-primary">
                        목록
                    </a>

                </th:block>

            </div>

        </div>

    </div>

</div>

</body>
</html>
