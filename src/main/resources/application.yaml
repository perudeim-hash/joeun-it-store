spring:
  application:
    name: joeun-it-store

  devtools:
    livereload:
      enabled: true
    restart:
      enabled: true

  thymeleaf:
    cache: false

  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    url: jdbc:oracle:thin:@//localhost:1521/XEPDB1
    username: shop
    password: 1234

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  web:
    resources:
      static-locations:
        - classpath:/static/
        - file:uploads/

mybatis:
  mapper-locations: classpath:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

file:
  upload-dir: uploads/